name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
      - alpha
      - beta

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  HexalithCommonsRoot: ${{ github.workspace }}/references/Hexalith.Commons
  # See the matching note in ci.yml: Hexalith.Tenants requires Hexalith.EventStore.Gateway, which has no PackageVersion
  # in the shared Hexalith.Builds catalog (and no 3.78.0 release to pin to), so package-mode restore fails NU1010 and
  # takes Hexalith.ChatBot.IntegrationTests down with it. Building the references/ submodules from source avoids the
  # gap until Hexalith.Builds carries the entry.
  UseHexalithProjectReferences: true

jobs:
  topology-acceptance:
    name: required Aspire + DAPR topology acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup DAPR CLI
        uses: dapr/setup-dapr@v2
      - name: Initialize DAPR runtime
        run: dapr init
      - name: Record DAPR runtime state
        run: docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' --filter name=dapr_
      # This step is the M2 stop-ship gate (Story 12.14, AC3), not only a topology smoke test. Its final leg polls the
      # token-gated /health/chatbot/periodic-enforcement/m2 endpoint on the live topology and fails when the gate
      # reports stop-ship — a broken WORM chain, a cross-tenant isolation breach, a sweep that never completed, or a
      # sweep that verified nothing where it should have. Because `semantic-release` needs this job, a real breach
      # blocks the release rather than merely being observable.
      #
      # The gate is asserted inside this test rather than as a separate step because it needs the live topology *and*
      # real post-command state: the sweeps verify tenant data that only exists once a governed command has flowed
      # through the spine, which is exactly what this test does first.
      - name: Run required tenant-bound topology smoke and M2 stop-ship gate
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.TrivialGovernedCommandAspireE2eTests.TrivialGovernedCommandShouldFlowEndToEndThroughTheRealDaprTopology"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=topology-acceptance.trx"
          --results-directory TestResults
      - name: Upload topology acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-topology-acceptance-evidence
          path: TestResults
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  semantic-release:
    needs: topology-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release
