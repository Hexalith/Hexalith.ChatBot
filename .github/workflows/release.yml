name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
      - alpha
      - beta

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  HexalithCommonsRoot: ${{ github.workspace }}/references/Hexalith.Commons
  # See the matching note in ci.yml: Hexalith.Tenants requires Hexalith.EventStore.Gateway, which has no PackageVersion
  # in the shared Hexalith.Builds catalog (and no 3.78.0 release to pin to), so package-mode restore fails NU1010 and
  # takes Hexalith.ChatBot.IntegrationTests down with it. Building the references/ submodules from source avoids the
  # gap until Hexalith.Builds carries the entry.
  UseHexalithProjectReferences: true

jobs:
  topology-acceptance:
    name: required Aspire + DAPR topology acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup checksum-pinned DAPR CLI
        run: bash .github/scripts/install-dapr-cli.sh
      - name: Initialize DAPR runtime
        run: dapr init --runtime-version 1.18.0
      - name: Record DAPR runtime state
        run: docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' --filter name=dapr_
      # This step is the M2 stop-ship gate (Story 12.14, AC3), not only a topology smoke test. Its final leg polls the
      # token-gated /health/chatbot/periodic-enforcement/m2 endpoint on the live topology and fails when the gate
      # reports stop-ship — a broken WORM chain, a cross-tenant isolation breach, a sweep that never completed, or a
      # sweep that verified nothing where it should have. Because `semantic-release` needs this job, a real breach
      # blocks the release rather than merely being observable.
      #
      # The gate is asserted inside this test rather than as a separate step because it needs the live topology *and*
      # real post-command state: the sweeps verify tenant data that only exists once a governed command has flowed
      # through the spine, which is exactly what this test does first.
      - name: Run required tenant-bound topology smoke and M2 stop-ship gate
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.TrivialGovernedCommandAspireE2eTests.TrivialGovernedCommandShouldFlowEndToEndThroughTheRealDaprTopology"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=topology-acceptance.trx"
          --results-directory TestResults
      - name: Upload topology acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-topology-acceptance-evidence
          path: TestResults
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-validation:
    # Producer only — the authoritative judge is `live-recovery-evidence-gate` below. Branch protection matches by
    # job NAME; calling this job an "evidence gate" made the producer indistinguishable from the independent judge.
    name: required live recovery validation sweep
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      # Keyed by COMMIT, not by ref. Distinct from the CI workflow's group so the required release gate never queues
      # behind the scheduled CI run of the same lane — but keying by ref did not fix the failure it was added for:
      # every push to `main` carries the same github.ref, so three pushes inside the 5.5-hour window still shared one
      # group and GitHub still cancelled the older PENDING run, turning a required check into a cancelled one and
      # silently skipping semantic-release for that commit. Ref-keying only separates DIFFERENT release branches.
      #
      # The lane runs on an ephemeral runner and composes its own Aspire topology, so there is no shared resource that
      # a repository-wide queue would protect; the group bought cost control and paid for it with a cancellable
      # required check. The per-commit key gives every publishable commit its own non-cancelling verdict and still
      # collapses a re-dispatch of the same commit. Accepted cost: N pushes inside the window now run N concurrent
      # 5.5-hour jobs instead of serializing behind one shared group.
      group: live-recovery-validation-release-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    # Least privilege: the workflow-level write scopes exist for semantic-release, not for a multi-hour fault-injection
    # job that executes submodule code.
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_ARTIFACT: release-live-recovery-validation-evidence
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Initialize metadata-only live recovery attempt envelope
        env:
          ATTEMPT_PATH: ${{ runner.temp }}/workflow-attempt/producer-attempt.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ATTEMPT_PATH")"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg job "$GITHUB_JOB" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg startedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{schemaVersion:"1.0",kind:"live-recovery-producer-attempt",repository:$repository,commit:$commit,workflow:$workflow,job:$job,runId:$runId,runAttempt:$runAttempt,startedAtUtc:$startedAtUtc,completedAtUtc:null,producerOutcome:"not-started"}' \
            > "$ATTEMPT_PATH"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup checksum-pinned DAPR CLI
        run: bash .github/scripts/install-dapr-cli.sh
      - name: Initialize DAPR runtime
        run: dapr init --runtime-version 1.18.0
      - name: Run all live recovery coordinators and retain evidence
        id: recovery
        # Bounded ladder, innermost first, so the in-process `finally` always wins the race to unwind a
        # half-injected fault: in-process deadline 265m < SIGINT 280m < step 300m < job 330m. Without the
        # inner margin the runner kills the process mid-injection and no restoration step ever runs.
        timeout-minutes: 300
        env:
          HEXALITH_CHATBOT_RECOVERY_WORKFLOW_TIMEOUT_MINUTES: "265"
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=15m 16800s \
            dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj \
            -m:1 \
            --configuration Release \
            --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveContinuityAspireE2eTests.LiveRecoveryValidationRunsAllThreeCoordinatorsAndPassesEvidenceGate" \
            --logger "console;verbosity=detailed" \
            --settings live-recovery.runsettings \
            --logger "trx;LogFileName=live-recovery-validation.trx" \
            --results-directory TestResults
      - name: Finalize metadata-only live recovery attempt envelope
        if: always()
        env:
          ATTEMPT_PATH: ${{ runner.temp }}/workflow-attempt/producer-attempt.json
          PRODUCER_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          temporary_path="${ATTEMPT_PATH}.tmp"
          jq \
            --arg completedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg producerOutcome "${PRODUCER_OUTCOME:-skipped}" \
            '.completedAtUtc=$completedAtUtc | .producerOutcome=$producerOutcome' \
            "$ATTEMPT_PATH" > "$temporary_path"
          mv "$temporary_path" "$ATTEMPT_PATH"
      - name: Upload live recovery reports, manifests, and raw test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-live-recovery-validation-evidence
          path: |
            TestResults
            ${{ runner.temp }}/workflow-attempt
          retention-days: 30
          if-no-files-found: error
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-evidence-gate:
    name: required independent live recovery evidence gate
    # The authoritative gate: a separate job, reading only the uploaded artifact, applying the thresholds configured
    # here rather than any the run declared about itself, evaluated against a fresh wall clock.
    #
    # Run after a failed producer too: evidence is uploaded with `if: always()`, and a Contained-breach / red
    # validation must still be judged out of process. Skip only when the producer itself was skipped.
    needs: live-recovery-validation
    if: always() && needs.live-recovery-validation.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: live-recovery-evidence-gate-release-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_REQUIRED: "1"
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_DIR: ${{ github.workspace }}/RetainedEvidence
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASETS: recovery-baseline
      HEXALITH_CHATBOT_RECOVERY_MAX_EVIDENCE_AGE_HOURS: "192"
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASET_VERSION: v1
      HEXALITH_CHATBOT_RECOVERY_MINIMUM_DATASET_VOLUME: "6"
      HEXALITH_CHATBOT_RECOVERY_MAX_MEASURABLE_CEILING_SECONDS: "180"
      HEXALITH_CHATBOT_RECOVERY_REQUIRED_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Download retained live recovery evidence
        uses: actions/download-artifact@v8
        with:
          name: release-live-recovery-validation-evidence
          path: RetainedEvidence
      - name: Evaluate the release evidence gate out of process
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveRecoveryEvidenceGateReplayTests.RetainedLiveRecoveryEvidenceShouldPassTheReleaseGateOutOfProcess"
          --logger "console;verbosity=detailed"
          --settings live-recovery.runsettings
          --logger "trx;LogFileName=live-recovery-evidence-gate.trx"
          --results-directory GateResults
      - name: Upload the gate decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-live-recovery-evidence-gate-decision
          path: GateResults
          retention-days: 30

  semantic-release:
    needs:
      - topology-acceptance
      - live-recovery-evidence-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release
