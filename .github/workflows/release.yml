name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
      - alpha
      - beta

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  HexalithCommonsRoot: ${{ github.workspace }}/references/Hexalith.Commons
  # Parties imports its package catalog from HexalithBuildsRoot and otherwise
  # points at an uninitialized nested Builds checkout. The root catalog is the
  # one this repository initializes.
  HexalithBuildsRoot: ${{ github.workspace }}/references/Hexalith.Builds
  UseHexalithProjectReferences: "false"

jobs:
  topology-acceptance:
    name: required Aspire + DAPR topology acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Release configuration
        run: bash .github/scripts/build-release-configuration.sh tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
      - name: Setup checksum-pinned DAPR CLI
        run: bash .github/scripts/install-dapr-cli.sh
      - name: Initialize DAPR runtime
        run: dapr init --runtime-version 1.18.0
      - name: Record DAPR runtime state
        run: docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' --filter name=dapr_
      - name: Run required fail-closed tenant-bound topology smoke
        run: >-
          XUNIT_REQUIRE_ZERO_SKIPS=1 bash .github/scripts/run-xunit-v4.sh
          tests/Hexalith.ChatBot.IntegrationTests/bin/Release/net10.0/Hexalith.ChatBot.IntegrationTests
          TestResults/topology-acceptance.ctrf.json
          -method "Hexalith.ChatBot.IntegrationTests.TrivialGovernedCommandAspireE2ETests.GovernedCommandsShouldFailClosedWithoutAtomicParticipationInRealDaprTopology"
          -result-trx TestResults/topology-acceptance.trx
      - name: Require one executed topology acceptance test and zero skips
        run: >-
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('TestResults/topology-acceptance.trx').getroot(); c=next(x for x in r.iter() if x.tag.endswith('Counters')).attrib; assert c.get('executed') == '1' and c.get('passed') == '1' and c.get('notExecuted') == '0', c"
      - name: Run exact Story 13.2 authenticated production-client matrix
        run: >-
          XUNIT_REQUIRE_ZERO_SKIPS=1 bash .github/scripts/run-xunit-v4.sh
          tests/Hexalith.ChatBot.IntegrationTests/bin/Release/net10.0/Hexalith.ChatBot.IntegrationTests
          TestResults/story132-topology-acceptance.ctrf.json
          -method "Hexalith.ChatBot.IntegrationTests.Story132ProductionBrowserAspireE2ETests.AuthenticatedProductionClientShouldFailClosedWithoutPersistingAcrossRequiredChromeMatrix"
          -result-trx TestResults/story132-topology-acceptance.trx
      - name: Require one executed Story 13.2 test and zero skips
        run: >-
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('TestResults/story132-topology-acceptance.trx').getroot(); c=next(x for x in r.iter() if x.tag.endswith('Counters')).attrib; assert c.get('executed') == '1' and c.get('passed') == '1' and c.get('notExecuted') == '0', c"
      # The release-only M2 gate requires real committed two-tenant governed state and positive sweep coverage.
      # Story 1.7's refusal smoke cannot supply that state. This separate gate remains red until Story 1.8 supplies
      # accepted atomic participation, and semantic-release still requires this job. Run it after Story 13.2 so
      # expected M2 unavailability cannot prevent the independent production-client refusal matrix from running.
      - name: Run required committed-state M2 stop-ship gate
        run: >-
          XUNIT_REQUIRE_ZERO_SKIPS=1 bash .github/scripts/run-xunit-v4.sh
          tests/Hexalith.ChatBot.IntegrationTests/bin/Release/net10.0/Hexalith.ChatBot.IntegrationTests
          TestResults/m2-stop-ship.ctrf.json
          -method "Hexalith.ChatBot.IntegrationTests.TrivialGovernedCommandAspireE2ETests.CommittedGovernedStateShouldPassM2StopShipSweepsInRealDaprTopology"
          -result-trx TestResults/m2-stop-ship.trx
      - name: Require one executed M2 stop-ship test and zero skips
        run: >-
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('TestResults/m2-stop-ship.trx').getroot(); c=next(x for x in r.iter() if x.tag.endswith('Counters')).attrib; assert c.get('executed') == '1' and c.get('passed') == '1' and c.get('notExecuted') == '0', c"
      - name: Upload topology acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-topology-acceptance-evidence
          path: TestResults
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-validation:
    # Producer only — the authoritative judge is `live-recovery-evidence-gate` below. Branch protection matches by
    # job NAME; calling this job an "evidence gate" made the producer indistinguishable from the independent judge.
    name: required live recovery validation sweep
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      # Keyed by COMMIT, not by ref. Distinct from the CI workflow's group so the required release gate never queues
      # behind the scheduled CI run of the same lane — but keying by ref did not fix the failure it was added for:
      # every push to `main` carries the same github.ref, so three pushes inside the 5.5-hour window still shared one
      # group and GitHub still cancelled the older PENDING run, turning a required check into a cancelled one and
      # silently skipping semantic-release for that commit. Ref-keying only separates DIFFERENT release branches.
      #
      # The lane runs on an ephemeral runner and composes its own Aspire topology, so there is no shared resource that
      # a repository-wide queue would protect; the group bought cost control and paid for it with a cancellable
      # required check. The per-commit key gives every publishable commit its own non-cancelling verdict and still
      # collapses a re-dispatch of the same commit. Accepted cost: N pushes inside the window now run N concurrent
      # 5.5-hour jobs instead of serializing behind one shared group.
      group: live-recovery-validation-release-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    # Least privilege: the workflow-level write scopes exist for semantic-release, not for a multi-hour fault-injection
    # job that executes submodule code.
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_ARTIFACT: release-live-recovery-validation-evidence
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Initialize metadata-only live recovery attempt envelope
        env:
          ATTEMPT_PATH: ${{ runner.temp }}/workflow-attempt/producer-attempt.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ATTEMPT_PATH")"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg job "$GITHUB_JOB" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg startedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{schemaVersion:"1.0",kind:"live-recovery-producer-attempt",repository:$repository,commit:$commit,workflow:$workflow,job:$job,runId:$runId,runAttempt:$runAttempt,startedAtUtc:$startedAtUtc,completedAtUtc:null,producerOutcome:"not-started"}' \
            > "$ATTEMPT_PATH"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Release configuration
        run: bash .github/scripts/build-release-configuration.sh tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
      - name: Setup checksum-pinned DAPR CLI
        run: bash .github/scripts/install-dapr-cli.sh
      - name: Initialize DAPR runtime
        run: dapr init --runtime-version 1.18.0
      - name: Run all live recovery coordinators and retain evidence
        id: recovery
        # Bounded ladder, innermost first, so the in-process `finally` always wins the race to unwind a
        # half-injected fault: in-process deadline 265m < SIGINT 280m < step 300m < job 330m. Without the
        # inner margin the runner kills the process mid-injection and no restoration step ever runs.
        timeout-minutes: 300
        env:
          HEXALITH_CHATBOT_RECOVERY_WORKFLOW_TIMEOUT_MINUTES: "265"
          HEXALITH_CHATBOT_RECOVERY_RETENTION_FAILURE_DIR: ${{ runner.temp }}/live-recovery-retention-failures
        run: |
          set -euo pipefail
          XUNIT_REQUIRE_ZERO_SKIPS=1 timeout --signal=INT --kill-after=15m 16800s \
            bash .github/scripts/run-xunit-v4.sh \
            tests/Hexalith.ChatBot.IntegrationTests/bin/Release/net10.0/Hexalith.ChatBot.IntegrationTests \
            TestResults/live-recovery-validation.ctrf.json \
            -method "Hexalith.ChatBot.IntegrationTests.Recovery.LiveContinuityAspireE2ETests.LiveRecoveryValidationRunsAllThreeCoordinatorsAndPassesEvidenceGate" \
            -result-trx TestResults/live-recovery-validation.trx
      - name: Finalize metadata-only live recovery attempt envelope
        if: always()
        env:
          ATTEMPT_PATH: ${{ runner.temp }}/workflow-attempt/producer-attempt.json
          RETENTION_FAILURE_ROOT: ${{ runner.temp }}/live-recovery-retention-failures
          PRODUCER_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          # Stage the independent marker/summary root before jq/mv/cp finalization can fail.
          mkdir -p TestResults/retention-failures
          if [[ -d "$RETENTION_FAILURE_ROOT" ]]; then
            # Non-blocking under `set -e`: staging runs FIRST, so a copy failure here must not abort the
            # always-run finalization commands below that previously always executed.
            cp -R "$RETENTION_FAILURE_ROOT"/. TestResults/retention-failures/ || true
          fi
          temporary_path="${ATTEMPT_PATH}.tmp"
          jq \
            --arg completedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg producerOutcome "${PRODUCER_OUTCOME:-skipped}" \
            '.completedAtUtc=$completedAtUtc | .producerOutcome=$producerOutcome' \
            "$ATTEMPT_PATH" > "$temporary_path"
          mv "$temporary_path" "$ATTEMPT_PATH"
          mkdir -p TestResults/workflow-attempt
          cp "$ATTEMPT_PATH" TestResults/workflow-attempt/producer-attempt.json
      - name: Upload live recovery reports, manifests, and raw test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-live-recovery-validation-evidence
          path: TestResults
          retention-days: 30
          if-no-files-found: error
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-evidence-gate:
    name: required independent live recovery evidence gate
    # The authoritative gate: a separate job, reading only the uploaded artifact, applying the thresholds configured
    # here rather than any the run declared about itself, evaluated against a fresh wall clock.
    #
    # Run after a failed producer too: evidence is uploaded with `if: always()`, and a Contained-breach / red
    # validation must still be judged out of process. Skip only when the producer itself was skipped.
    needs: live-recovery-validation
    if: always() && needs.live-recovery-validation.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: live-recovery-evidence-gate-release-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_REQUIRED: "1"
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_DIR: ${{ github.workspace }}/RetainedEvidence
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASETS: recovery-baseline
      HEXALITH_CHATBOT_RECOVERY_MAX_EVIDENCE_AGE_HOURS: "192"
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASET_VERSION: v1
      HEXALITH_CHATBOT_RECOVERY_MINIMUM_DATASET_VOLUME: "6"
      HEXALITH_CHATBOT_RECOVERY_MAX_MEASURABLE_CEILING_SECONDS: "180"
      HEXALITH_CHATBOT_RECOVERY_REQUIRED_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Release configuration
        run: bash .github/scripts/build-release-configuration.sh tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
      - name: Download retained live recovery evidence
        uses: actions/download-artifact@v8
        with:
          name: release-live-recovery-validation-evidence
          path: RetainedEvidence
      - name: Evaluate the release evidence gate out of process
        run: >-
          XUNIT_REQUIRE_ZERO_SKIPS=1 bash .github/scripts/run-xunit-v4.sh
          tests/Hexalith.ChatBot.IntegrationTests/bin/Release/net10.0/Hexalith.ChatBot.IntegrationTests
          GateResults/live-recovery-evidence-gate.ctrf.json
          -method "Hexalith.ChatBot.IntegrationTests.Recovery.LiveRecoveryEvidenceGateReplayTests.RetainedLiveRecoveryEvidenceShouldPassTheReleaseGateOutOfProcess"
          -result-trx GateResults/live-recovery-evidence-gate.trx
      - name: Upload the gate decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-live-recovery-evidence-gate-decision
          path: GateResults
          retention-days: 30

  semantic-release:
    needs:
      - topology-acceptance
      - live-recovery-evidence-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard main publication against a stale validated commit
        id: publication_guard
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          VALIDATED_SHA: ${{ github.sha }}
        run: bash .github/scripts/guard-main-publication.sh "$RELEASE_BRANCH" "$VALIDATED_SHA"
      - name: Release
        if: steps.publication_guard.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organization publishing key. This job does not use a protected environment, so publication
          # does not wait for a human reviewer.
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: npx --yes -p semantic-release -p @semantic-release/exec semantic-release
      - name: Verify published NuGet packages
        if: success() && steps.publication_guard.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          version="$(git describe --tags --exact-match HEAD | sed 's/^v//')"
          bash .github/scripts/verify-nuget-publication.sh "$version"
