name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - next
      - alpha
      - beta
  # The destructive live-recovery lane is scheduled, never per-PR. The cadence matches
  # LiveRecoveryValidationOptions.Cadence (7 days) so the configured value governs something real.
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  HexalithCommonsRoot: ${{ github.workspace }}/references/Hexalith.Commons
  # Build the Hexalith dependencies from the references/ source submodules rather than from published NuGet packages.
  #
  # Required, not preferred: Hexalith.Tenants references Hexalith.EventStore.Gateway, first published at 3.82.0, while
  # the shared Hexalith.Builds catalog still pins the EventStore package family at 3.78.0 and carries no PackageVersion
  # entry for Gateway at all. In package mode that fails Central Package Management with NU1010, breaking the whole
  # solution restore and everything downstream of Tenants (including Hexalith.ChatBot.IntegrationTests). With this set,
  # each affected csproj takes its ProjectReference branch (gated on HexalithEventStoreFromSource) against
  # references/Hexalith.EventStore, which is checked out at v3.86.0 and does contain the Gateway project.
  #
  # It is set here as an environment variable on purpose: every submodule ships its own Directory.Build.props and
  # Directory.Packages.props that shadow this repository's root files, so the property cannot be set from them. An
  # environment variable reaches MSBuild as a global property; Directory.Build.rsp does not work because the dotnet CLI
  # does not read auto-response files.
  #
  # The durable fix belongs in the Hexalith.Builds repository: add Hexalith.EventStore.Gateway to its catalog and align
  # HexalithEventStoreVersion with the checked-out submodule. Remove this once that lands, if package mode is preferred.
  UseHexalithProjectReferences: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact producer event head
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore Hexalith.ChatBot.slnx
      - name: Build
        run: dotnet build Hexalith.ChatBot.slnx --no-restore --configuration Release
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(find tests -mindepth 2 -maxdepth 2 -name '*.csproj' -print | sort)
          declare -A seen_lanes=()
          for project in "${projects[@]}"; do
            lane="$(basename "${project%.csproj}")"
            if [[ -n "${seen_lanes[$lane]+present}" ]]; then
              printf 'Colliding test lane %s: %s and %s\n' "$lane" "${seen_lanes[$lane]}" "$project" >&2
              exit 1
            fi
            seen_lanes[$lane]="$project"
          done
          for project in "${projects[@]}"; do
            if [[ "$project" == *"Hexalith.ChatBot.RecoverySandbox.csproj" ]]; then
              continue
            fi
            lane="$(basename "${project%.csproj}")"
            output="TestResults/${lane}"
            dotnet test "$project" --no-build --configuration Release \
              --logger "trx;LogFileName=${lane}.trx" --results-directory "$output"
            sha256sum "${output}/${lane}.trx" > "${output}/${lane}.trx.sha256"
          done
          printf '%s\n' "$(git rev-parse HEAD)" > TestResults/producer-head.sha
      - name: Upload collision-safe machine results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-test-results
          path: TestResults
          retention-days: 30

  story-evidence-integrity:
    name: story-evidence-integrity
    needs: [build, topology-acceptance]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout full transition history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize root-declared references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Require successful general machine-result producer
        if: needs.build.result != 'success'
        run: exit 1
      - name: Download machine results
        uses: actions/download-artifact@v4
        with:
          name: machine-test-results
          path: ${{ runner.temp }}/machine-results
      - name: Run gate self-tests with current-run TRX
        run: >-
          dotnet test tests/Hexalith.ChatBot.StoryEvidenceGate.Tests/Hexalith.ChatBot.StoryEvidenceGate.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=story-evidence-gate.trx"
          --results-directory "${{ runner.temp }}/machine-results/story-evidence-gate"
      - name: Resolve exact transition bounds
        id: bounds
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE"
            head_sha="$PR_HEAD"
          elif [[ -n "${PUSH_BASE:-}" && ! "$PUSH_BASE" =~ ^0+$ ]] && git cat-file -e "${PUSH_BASE}^{commit}"; then
            base_sha="$PUSH_BASE"
            head_sha="$PUSH_HEAD"
          else
            head_sha="$PUSH_HEAD"
            base_sha="$(git rev-parse HEAD^)"
          fi
          checked_out_head="$(git rev-parse HEAD)"
          if [[ "$checked_out_head" != "$head_sha" ]]; then
            printf 'Checked-out HEAD %s does not match event head %s.\n' "$checked_out_head" "$head_sha" >&2
            exit 1
          fi
          printf 'base=%s\nhead=%s\n' "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"
      - name: Detect proposed completion transitions
        env:
          TRANSITIONS_PATH: ${{ runner.temp }}/story-evidence-transitions.json
        run: >-
          dotnet run --project tools/Hexalith.ChatBot.StoryEvidenceGate/Hexalith.ChatBot.StoryEvidenceGate.csproj
          --configuration Release --no-build -- detect
          --base "${{ steps.bounds.outputs.base }}"
          --head "${{ steps.bounds.outputs.head }}"
          --output "$TRANSITIONS_PATH"
      - name: Resolve transition-declared artifact requirements
        id: artifacts
        shell: bash
        env:
          TRANSITIONS_PATH: ${{ runner.temp }}/story-evidence-transitions.json
          RETAINED_LOCATORS_PATH: ${{ runner.temp }}/story-evidence-retained-locators.txt
        run: |
          set -euo pipefail
          requires_topology=false
          : > "$RETAINED_LOCATORS_PATH"
          while IFS= read -r contract; do
            [[ -z "$contract" ]] && continue
            if [[ ! -f "$contract" ]]; then
              printf 'Detected transition contract is missing.\n' >&2
              exit 1
            fi
            if jq -e '.results[]? | select(.source == "current-run" and .lane == "aspire-dapr-primary")' \
                "$contract" > /dev/null; then
              requires_topology=true
            fi
            jq -r '.results[]? | select(.source == "retained") | .artifactLocator' \
              "$contract" >> "$RETAINED_LOCATORS_PATH"
          done < <(jq -r '.[].contractPath' "$TRANSITIONS_PATH")
          sort -u -o "$RETAINED_LOCATORS_PATH" "$RETAINED_LOCATORS_PATH"
          printf 'requires_topology=%s\n' "$requires_topology" >> "$GITHUB_OUTPUT"
      - name: Require successful topology producer when transition-declared
        if: steps.artifacts.outputs.requires_topology == 'true' && needs.topology-acceptance.result != 'success'
        run: exit 1
      - name: Download transition-declared current topology primary result
        if: steps.artifacts.outputs.requires_topology == 'true'
        uses: actions/download-artifact@v4
        with:
          name: topology-acceptance-evidence
          path: ${{ runner.temp }}/machine-results/topology-primary
      - name: Collect transition-declared retained exact-run artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_ROOT: ${{ runner.temp }}/machine-results
          RETAINED_LOCATORS_PATH: ${{ runner.temp }}/story-evidence-retained-locators.txt
        run: |
          set -euo pipefail
          declare -A downloaded=()
          while IFS= read -r locator; do
            [[ -z "$locator" ]] && continue
            if [[ ! "$locator" =~ ^github-actions://([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)/runs/([1-9][0-9]{0,19})/artifacts/([A-Za-z0-9][A-Za-z0-9_.-]{0,127})$ ]]; then
              printf 'Unsafe retained locator.\n' >&2
              exit 1
            fi
            repository="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            run_id="${BASH_REMATCH[3]}"
            artifact="${BASH_REMATCH[4]}"
            if [[ "$repository" != "$GITHUB_REPOSITORY" ]]; then
              printf 'Retained locator repository %s is not this repository (%s).\n' "$repository" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
            key="${repository}/${run_id}/${artifact}"
            [[ -n "${downloaded[$key]+present}" ]] && continue
            destination="${RESULTS_ROOT}/retained/${run_id}/${artifact}"
            if [[ -e "$destination" ]]; then
              printf 'Retained destination collision.\n' >&2
              exit 1
            fi
            mkdir -p "$destination"
            gh run download "$run_id" --repo "$repository" --name "$artifact" --dir "$destination"
            downloaded[$key]=1
          done < "$RETAINED_LOCATORS_PATH"
      - name: Verify general producer artifact binds the exact event head
        run: |
          set -euo pipefail
          test "$(cat "${{ runner.temp }}/machine-results/producer-head.sha")" = "${{ steps.bounds.outputs.head }}"
      - name: Verify topology producer artifact binds the exact event head when transition-declared
        if: steps.artifacts.outputs.requires_topology == 'true'
        run: |
          set -euo pipefail
          test "$(cat "${{ runner.temp }}/machine-results/topology-primary/producer-head.sha")" = "${{ steps.bounds.outputs.head }}"
      - name: Attest and evaluate proposed completion transitions
        run: >-
          dotnet run --project tools/Hexalith.ChatBot.StoryEvidenceGate/Hexalith.ChatBot.StoryEvidenceGate.csproj
          --configuration Release -- ci
          --base "${{ steps.bounds.outputs.base }}"
          --head "${{ steps.bounds.outputs.head }}"
          --results "${{ runner.temp }}/machine-results"
          --report-directory "${{ runner.temp }}/story-evidence-reports"
      - name: Upload story-evidence reports and provenance sidecars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-evidence-integrity-reports
          path: |
            ${{ runner.temp }}/story-evidence-reports
            ${{ runner.temp }}/machine-results/**/*.provenance.json
          retention-days: 30

  topology-acceptance:
    name: required Aspire + DAPR topology acceptance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact topology producer event head
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup DAPR CLI
        uses: dapr/setup-dapr@v2
      - name: Initialize DAPR runtime
        run: dapr init
      - name: Record DAPR runtime state
        run: docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' --filter name=dapr_
      - name: Run required tenant-bound topology smoke
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.TrivialGovernedCommandAspireE2eTests.TrivialGovernedCommandShouldFlowEndToEndThroughTheRealDaprTopology"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=topology-acceptance.trx"
          --results-directory TestResults
      - name: Record topology producer head
        run: printf '%s\n' "$(git rev-parse HEAD)" > TestResults/producer-head.sha
      - name: Upload topology acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-acceptance-evidence
          path: TestResults
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-validation:
    # Named distinctly from the release workflow's job: branch protection matches required checks by job
    # NAME, and this copy is gated to schedule/dispatch, so a shared name let a run that is SKIPPED on
    # every push and pull request satisfy a required check meant for the release lane.
    name: scheduled live recovery validation sweep
    needs: build
    # Destructive, serialized, and up to 5.5 hours: run it on the cadence schedule or on explicit dispatch, never on
    # every pull request or push. Running it per-PR made every PR queue a 5.5-hour fault-injection job.
    # workflow_dispatch is a DELIBERATE, disclosed part of the blast radius: any user with write access can launch
    # this destructive 5.5-hour fault-injection lane on demand. Round 3 flagged both halves of that finding; only the
    # least-privilege `permissions` half was applied, and the dispatch half went unrecorded until round 5. It is kept
    # because an on-demand re-run is needed after a failed scheduled sweep, and the job holds `contents: read` only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      # Distinct from the release workflow's group. Sharing one repository-wide group made the required release
      # check queue behind this run for up to 5.5 hours, and GitHub cancels the older of two pending runs.
      group: live-recovery-validation-ci-${{ github.repository }}
      cancel-in-progress: false
    # Least privilege: this job runs multi-hour fault injection and arbitrary submodule code. It needs to read the
    # repository and nothing else; the default token scope would let a compromised step write to it.
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_ARTIFACT: live-recovery-validation-evidence
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup DAPR CLI
        uses: dapr/setup-dapr@v2
      - name: Initialize DAPR runtime
        run: dapr init
      - name: Run all live recovery coordinators and retain evidence
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveContinuityAspireE2eTests.LiveRecoveryValidationRunsAllThreeCoordinatorsAndPassesEvidenceGate"
          --logger "console;verbosity=detailed"
          --settings live-recovery.runsettings
          --logger "trx;LogFileName=live-recovery-validation.trx"
          --results-directory TestResults
      - name: Upload live recovery reports, manifests, and raw test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-recovery-validation-evidence
          path: TestResults
          retention-days: 30
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-evidence-gate:
    name: scheduled live recovery evidence gate
    # The authoritative gate. It runs in a SEPARATE job from the run that produced the evidence, reads only the
    # uploaded artifact, applies the thresholds configured here rather than any the run declared about itself, and
    # evaluates against a fresh wall clock so the staleness branches are reachable. Evaluating the gate in-process
    # inside the producing test meant the run supplied its own judge with its own answers.
    #
    # Run after a failed producer too: evidence is uploaded with `if: always()`, and a Contained-breach / red
    # validation must still be judged out of process. Skip only when the producer itself was skipped (push/PR).
    needs: live-recovery-validation
    if: always() && needs.live-recovery-validation.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_REQUIRED: "1"
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_DIR: ${{ github.workspace }}/RetainedEvidence
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASETS: recovery-baseline
      HEXALITH_CHATBOT_RECOVERY_MAX_EVIDENCE_AGE_HOURS: "192"
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASET_VERSION: v1
      HEXALITH_CHATBOT_RECOVERY_MINIMUM_DATASET_VOLUME: "6"
      HEXALITH_CHATBOT_RECOVERY_MAX_MEASURABLE_CEILING_SECONDS: "180"
      HEXALITH_CHATBOT_RECOVERY_REQUIRED_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Download retained live recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: live-recovery-validation-evidence
          path: RetainedEvidence
      - name: Evaluate the release evidence gate out of process
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveRecoveryEvidenceGateReplayTests.RetainedLiveRecoveryEvidenceShouldPassTheReleaseGateOutOfProcess"
          --logger "console;verbosity=detailed"
          --settings live-recovery.runsettings
          --logger "trx;LogFileName=live-recovery-evidence-gate.trx"
          --results-directory GateResults
      - name: Upload the gate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-recovery-evidence-gate-decision
          path: GateResults
          retention-days: 30
