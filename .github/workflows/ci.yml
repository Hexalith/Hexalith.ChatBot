name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - next
      - alpha
      - beta

env:
  HexalithCommonsRoot: ${{ github.workspace }}/references/Hexalith.Commons
  # Build the Hexalith dependencies from the references/ source submodules rather than from published NuGet packages.
  #
  # Required, not preferred: Hexalith.Tenants references Hexalith.EventStore.Gateway, first published at 3.82.0, while
  # the shared Hexalith.Builds catalog still pins the EventStore package family at 3.78.0 and carries no PackageVersion
  # entry for Gateway at all. In package mode that fails Central Package Management with NU1010, breaking the whole
  # solution restore and everything downstream of Tenants (including Hexalith.ChatBot.IntegrationTests). With this set,
  # each affected csproj takes its ProjectReference branch (gated on HexalithEventStoreFromSource) against
  # references/Hexalith.EventStore, which is checked out at v3.86.0 and does contain the Gateway project.
  #
  # It is set here as an environment variable on purpose: every submodule ships its own Directory.Build.props and
  # Directory.Packages.props that shadow this repository's root files, so the property cannot be set from them. An
  # environment variable reaches MSBuild as a global property; Directory.Build.rsp does not work because the dotnet CLI
  # does not read auto-response files.
  #
  # The durable fix belongs in the Hexalith.Builds repository: add Hexalith.EventStore.Gateway to its catalog and align
  # HexalithEventStoreVersion with the checked-out submodule. Remove this once that lands, if package mode is preferred.
  UseHexalithProjectReferences: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore Hexalith.ChatBot.slnx
      - name: Build
        run: dotnet build Hexalith.ChatBot.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Hexalith.ChatBot.slnx --no-build --configuration Release

  topology-acceptance:
    name: required Aspire + DAPR topology acceptance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup DAPR CLI
        uses: dapr/setup-dapr@v2
      - name: Initialize DAPR runtime
        run: dapr init
      - name: Record DAPR runtime state
        run: docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' --filter name=dapr_
      - name: Run required tenant-bound topology smoke
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.TrivialGovernedCommandAspireE2eTests.TrivialGovernedCommandShouldFlowEndToEndThroughTheRealDaprTopology"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=topology-acceptance.trx"
          --results-directory TestResults
      - name: Upload topology acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-acceptance-evidence
          path: TestResults
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all
