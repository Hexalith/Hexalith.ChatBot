name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - next
      - alpha
      - beta
  # The destructive live-recovery lane is scheduled, never per-PR. The cadence matches
  # LiveRecoveryValidationOptions.Cadence (7 days) so the configured value governs something real.
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  HexalithCommonsRoot: ${{ github.workspace }}/references/Hexalith.Commons
  # Build the Hexalith dependencies from the references/ source submodules rather than from published NuGet packages.
  #
  # Required, not preferred: Hexalith.Tenants references Hexalith.EventStore.Gateway, first published at 3.82.0, while
  # the shared Hexalith.Builds catalog still pins the EventStore package family at 3.78.0 and carries no PackageVersion
  # entry for Gateway at all. In package mode that fails Central Package Management with NU1010, breaking the whole
  # solution restore and everything downstream of Tenants (including Hexalith.ChatBot.IntegrationTests). With this set,
  # each affected csproj takes its ProjectReference branch (gated on HexalithEventStoreFromSource) against
  # references/Hexalith.EventStore, which is checked out at v3.86.0 and does contain the Gateway project.
  #
  # It is set here as an environment variable on purpose: every submodule ships its own Directory.Build.props and
  # Directory.Packages.props that shadow this repository's root files, so the property cannot be set from them. An
  # environment variable reaches MSBuild as a global property; Directory.Build.rsp does not work because the dotnet CLI
  # does not read auto-response files.
  #
  # The durable fix belongs in the Hexalith.Builds repository: add Hexalith.EventStore.Gateway to its catalog and align
  # HexalithEventStoreVersion with the checked-out submodule. Remove this once that lands, if package mode is preferred.
  UseHexalithProjectReferences: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact producer event head
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore Hexalith.ChatBot.slnx
      - name: Build
        # -m:1 serializes project builds. Several referenced submodule projects
        # (Hexalith.Projects.Client.Generation, Hexalith.FrontComposer.Shell) are reached by more
        # than one path in the graph, and parallel nodes intermittently raced writing their
        # obj/ outputs, failing this required step with MSB4018 GenerateDepsFile /
        # GetAssemblyAttributes "used by another process" errors.
        run: dotnet build Hexalith.ChatBot.slnx --no-restore --configuration Release -m:1
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(find tests -type f -name '*.csproj' -print | sort)
          expected_projects=15
          if (( ${#projects[@]} != expected_projects )); then
            printf 'Expected %s test projects under tests/, discovered %s.\n' \
              "$expected_projects" "${#projects[@]}" >&2
            exit 1
          fi
          declare -A seen_lanes=()
          for project in "${projects[@]}"; do
            lane="$(basename "${project%.csproj}")"
            if [[ -n "${seen_lanes[$lane]+present}" ]]; then
              printf 'Colliding test lane %s: %s and %s\n' "$lane" "${seen_lanes[$lane]}" "$project" >&2
              exit 1
            fi
            seen_lanes[$lane]="$project"
          done
          executed=0
          for project in "${projects[@]}"; do
            if [[ "$project" == *"Hexalith.ChatBot.RecoverySandbox.csproj" \
              || "$project" == *"Hexalith.ChatBot.StoryEvidenceGate.Tests.csproj" ]]; then
              continue
            fi
            lane="$(basename "${project%.csproj}")"
            output="TestResults/${lane}"
            dotnet test "$project" --no-build --configuration Release \
              --logger "trx;LogFileName=${lane}.trx" --results-directory "$output"
            sha256sum "${output}/${lane}.trx" > "${output}/${lane}.trx.sha256"
            executed=$((executed + 1))
          done
          expected_lanes=13
          if (( executed != expected_lanes )); then
            printf 'Expected %s general test lanes, executed %s; refusing a partial green job.\n' \
              "$expected_lanes" "$executed" >&2
            exit 1
          fi
          printf '%s\n' "$(git rev-parse HEAD)" > TestResults/producer-head.sha
      - name: Upload collision-safe machine results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: machine-test-results
          path: TestResults
          retention-days: 30

  story-evidence-integrity:
    name: story-evidence-integrity
    needs: [build, topology-acceptance]
    if: always()
    runs-on: ubuntu-latest
    # The recovery producer has a 250-minute in-process deadline and a 265-minute external interrupt. It may start
    # only within the first 40 minutes; the remaining fixed closeout budget covers from-scratch restore/build and
    # gate self-tests as well as fault restoration, sanitization, attestation, validation, and upload.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Record completion job budget origin
        run: date +%s > "${{ runner.temp }}/story-evidence-job-start.epoch"
      - name: Checkout full transition history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize root-declared references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Require successful general machine-result producer
        if: needs.build.result != 'success'
        run: exit 1
      - name: Download machine results
        uses: actions/download-artifact@v8
        with:
          name: machine-test-results
          path: ${{ runner.temp }}/machine-results
      - name: Resolve exact transition bounds
        id: bounds
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE"
            head_sha="$PR_HEAD"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            head_sha="$PUSH_HEAD"
            if [[ -z "${PUSH_BASE:-}" || "$PUSH_BASE" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse HEAD^)"
            elif git cat-file -e "${PUSH_BASE}^{commit}"; then
              base_sha="$PUSH_BASE"
            else
              printf 'Non-zero push base %s is unavailable; refusing a one-commit fallback.\n' "$PUSH_BASE" >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # These events do not propose a lifecycle transition. Use an empty exact range instead of
            # re-evaluating HEAD^..HEAD as though the latest commit had just been pushed again.
            head_sha="$PUSH_HEAD"
            base_sha="$head_sha"
          else
            printf 'Unsupported story-evidence event %s.\n' "$EVENT_NAME" >&2
            exit 1
          fi
          checked_out_head="$(git rev-parse HEAD)"
          if [[ "$checked_out_head" != "$head_sha" ]]; then
            printf 'Checked-out HEAD %s does not match event head %s.\n' "$checked_out_head" "$head_sha" >&2
            exit 1
          fi
          printf 'base=%s\nhead=%s\n' "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"
      # Builds the gate tool for every `--no-build` step below. The gate self-tests used to sit here and
      # supplied this build as a side effect; moving them after the drill (so their TRX is a fresh in-job
      # current-run lane) removed the only build in this job and left `plan --no-build` with no assembly.
      # An explicit build keeps the two concerns independent.
      - name: Build the story-evidence gate tool
        run: >-
          dotnet build tools/Hexalith.ChatBot.StoryEvidenceGate/Hexalith.ChatBot.StoryEvidenceGate.csproj
          --configuration Release
          -m:1
      - name: Plan proposed completion production
        env:
          PRODUCTION_PLAN_PATH: ${{ runner.temp }}/story-evidence-production-plan.json
        run: >-
          dotnet run --project tools/Hexalith.ChatBot.StoryEvidenceGate/Hexalith.ChatBot.StoryEvidenceGate.csproj
          --configuration Release --no-build -- plan
          --base "${{ steps.bounds.outputs.base }}"
          --head "${{ steps.bounds.outputs.head }}"
          --results "${{ runner.temp }}/machine-results"
          --output "$PRODUCTION_PLAN_PATH"
      - name: Resolve transition-declared artifact requirements
        id: artifacts
        shell: bash
        env:
          PRODUCTION_PLAN_PATH: ${{ runner.temp }}/story-evidence-production-plan.json
          RETAINED_LOCATORS_PATH: ${{ runner.temp }}/story-evidence-retained-locators.txt
        run: |
          set -euo pipefail
          requires_topology="$(jq -r '.requiresTopology' "$PRODUCTION_PLAN_PATH")"
          requires_recovery="$(jq -r '.requiresRecovery' "$PRODUCTION_PLAN_PATH")"
          jq -r '.retainedLocators[]?' "$PRODUCTION_PLAN_PATH" > "$RETAINED_LOCATORS_PATH"
          printf 'requires_topology=%s\nrequires_recovery=%s\n' \
            "$requires_topology" "$requires_recovery" >> "$GITHUB_OUTPUT"
      - name: Require successful topology producer when transition-declared
        if: steps.artifacts.outputs.requires_topology == 'true' && needs.topology-acceptance.result != 'success'
        run: exit 1
      - name: Download transition-declared current topology primary result
        if: steps.artifacts.outputs.requires_topology == 'true'
        uses: actions/download-artifact@v8
        with:
          name: topology-acceptance-evidence
          path: ${{ runner.temp }}/machine-results/topology-primary
      - name: Setup DAPR CLI for transition-declared current recovery primary
        if: steps.artifacts.outputs.requires_recovery == 'true'
        run: bash .github/scripts/install-dapr-cli.sh
      - name: Preserve recovery cleanup and publication reserve
        if: steps.artifacts.outputs.requires_recovery == 'true'
        run: |
          set -euo pipefail
          job_start_epoch=$(cat "${{ runner.temp }}/story-evidence-job-start.epoch")
          elapsed_seconds=$(($(date +%s) - job_start_epoch))
          if (( elapsed_seconds >= 2400 )); then
            printf 'Recovery producer refused after %s seconds; the 30-minute cleanup/publication reserve would be unsafe.\n' \
              "$elapsed_seconds" >&2
            exit 1
          fi
          printf '%s\n' "$((job_start_epoch + (330 * 60)))" \
            > "${{ runner.temp }}/story-evidence-closeout-deadline.epoch"
      - name: Initialize DAPR runtime for transition-declared current recovery primary
        if: steps.artifacts.outputs.requires_recovery == 'true'
        timeout-minutes: 10
        run: dapr init --runtime-version 1.18.0
      - name: Produce transition-declared current recovery primary result
        id: recovery
        if: steps.artifacts.outputs.requires_recovery == 'true'
        timeout-minutes: 285
        env:
          HEXALITH_CHATBOT_RECOVERY_EVIDENCE_ARTIFACT: completion-recovery-evidence
          # Strictly inside the 265-minute SIGINT below, which is itself inside the 285-minute step bound.
          # Equal inner and outer bounds meant the external signal always won and the in-process cleanup
          # guard documented in LiveContinuityAspireE2eTests was unreachable.
          HEXALITH_CHATBOT_RECOVERY_WORKFLOW_TIMEOUT_MINUTES: "250"
          HEXALITH_CHATBOT_TIER3: "1"
          HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
          ChatBotServiceGrants__LifetimeDays: "90"
        run: |
          set -euo pipefail
          closeout_deadline=$(cat "${{ runner.temp }}/story-evidence-closeout-deadline.epoch")
          remaining_seconds=$((closeout_deadline - $(date +%s)))
          if (( remaining_seconds <= 900 )); then
            printf 'Recovery producer refused with only %s seconds before fixed closeout.\n' \
              "$remaining_seconds" >&2
            exit 1
          fi
          interrupt_after_seconds=$((remaining_seconds - 900))
          if (( interrupt_after_seconds > 15900 )); then
            interrupt_after_seconds=15900
          fi
          timeout --signal=INT --kill-after=15m "${interrupt_after_seconds}s" \
            dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj \
            -m:1 \
            --configuration Release \
            --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveContinuityAspireE2eTests.LiveRecoveryValidationRunsAllThreeCoordinatorsAndPassesEvidenceGate" \
            --logger "console;verbosity=minimal" \
            --settings live-recovery.runsettings \
            --logger "trx;LogFileName=live-recovery-validation.trx" \
            --results-directory "${{ runner.temp }}/raw-recovery-results"
      - name: Stop DAPR runtime for transition-declared current recovery primary
        if: always() && steps.artifacts.outputs.requires_recovery == 'true'
        run: dapr uninstall --all
      # Produced AFTER the drill on purpose. This is the only current-run lane produced inside this job, so
      # running it here keeps it inside the global 60-minute freshness ceiling even when the recovery producer
      # has just consumed four hours. The upstream build/topology lanes cannot be refreshed by ordering --
      # their TRX finish timestamps are fixed in the jobs that produced them -- so EVERY declared primary lane
      # carries an explicit 360-minute per-lane ceiling in story-evidence-policy.json.
      #
      # Stated plainly, because an earlier version of this comment claimed the opposite: this IS the global bound
      # relaxed for every declared lane, expressed per-lane. The 2026-08-25 decision asked for the ceiling on
      # recovery-primary only, on the premise that reordering would keep the fast lanes fresh. That premise was
      # wrong -- reordering refreshes only the in-job story-evidence-gate lane, because the other four finish in
      # the upstream build job and age by the whole drill. Note the inversion this leaves: recovery-primary's TRX
      # is sanitized minutes before attestation, so the wide window buys IT nothing and the four upstream lanes
      # are what actually consume the relaxation. Ratified 2026-08-26; the ceiling is pinned in
      # StoryEvidenceValidator so it cannot be widened without a code change.
      - name: Run gate self-tests with current-run TRX
        # always(): this step is also the build prerequisite for the always()-guarded summarizer below. Without
        # it, GitHub's implied success() skips this step the moment the drill fails, and ADV-3's failure summary
        # -- the whole point of which is to survive a failed drill -- has no assembly to run.
        if: always()
        run: >-
          dotnet test tests/Hexalith.ChatBot.StoryEvidenceGate.Tests/Hexalith.ChatBot.StoryEvidenceGate.Tests.csproj
          -m:1
          --configuration Release
          --logger "trx;LogFileName=story-evidence-gate.trx"
          --results-directory "${{ runner.temp }}/machine-results/story-evidence-gate"
      - name: Summarize recovery attempt into metadata-only failure record
        if: always() && steps.artifacts.outputs.requires_recovery == 'true'
        run: >-
          dotnet run --project tools/Hexalith.ChatBot.StoryEvidenceGate/Hexalith.ChatBot.StoryEvidenceGate.csproj
          --configuration Release --no-build -- summarize-recovery-attempt
          --input "${{ runner.temp }}/raw-recovery-results/live-recovery-validation.trx"
          --outcome "${{ steps.recovery.outcome }}"
          --output "TestResults/completion-recovery/recovery-attempt-summary.json"
      - name: Project recovery result into metadata-only completion TRX
        if: steps.artifacts.outputs.requires_recovery == 'true'
        run: >-
          dotnet run --project tools/Hexalith.ChatBot.StoryEvidenceGate/Hexalith.ChatBot.StoryEvidenceGate.csproj
          --configuration Release --no-build -- sanitize-recovery-trx
          --input "${{ runner.temp }}/raw-recovery-results/live-recovery-validation.trx"
          --output "${{ runner.temp }}/machine-results/recovery-primary/live-recovery-validation.trx"
      - name: Stage metadata-only completion result under the artifact root
        if: always() && steps.artifacts.outputs.requires_recovery == 'true'
        run: |
          set -euo pipefail
          mkdir -p TestResults/completion-recovery
          sanitized="${{ runner.temp }}/machine-results/recovery-primary/live-recovery-validation.trx"
          if [[ -f "$sanitized" ]]; then
            cp "$sanitized" TestResults/completion-recovery/live-recovery-validation.trx
          fi
      - name: Upload metadata-only recovery attempt evidence
        if: always() && steps.artifacts.outputs.requires_recovery == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: completion-recovery-evidence
          path: TestResults
          retention-days: 30
          # warn, not error: this upload is always(), and on the failure path it exists for, the summarizer and
          # sanitizer outputs may not exist. Failing here would mask the recovery failure behind an artifact error.
          # The manifests directory is included because every completion manifest stamps
          # artifact:completion-recovery-evidence as its locator -- without it the locator named an artifact that
          # contained none of the evidence it pointed at, which is ADV-4's defect through a different door.
          if-no-files-found: warn
      - name: Collect transition-declared retained exact-run artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_ROOT: ${{ runner.temp }}/machine-results
          RETAINED_LOCATORS_PATH: ${{ runner.temp }}/story-evidence-retained-locators.txt
        run: |
          set -euo pipefail
          declare -A downloaded=()
          while IFS= read -r locator; do
            [[ -z "$locator" ]] && continue
            if [[ ! "$locator" =~ ^github-actions://([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)/runs/([1-9][0-9]{0,19})/artifacts/([A-Za-z0-9][A-Za-z0-9_.-]{0,127})$ ]]; then
              printf 'Unsafe retained locator.\n' >&2
              exit 1
            fi
            repository="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            run_id="${BASH_REMATCH[3]}"
            artifact="${BASH_REMATCH[4]}"
            if [[ "$repository" != "$GITHUB_REPOSITORY" ]]; then
              printf 'Retained locator repository %s is not this repository (%s).\n' "$repository" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
            key="${repository}/${run_id}/${artifact}"
            [[ -n "${downloaded[$key]+present}" ]] && continue
            destination="${RESULTS_ROOT}/retained/${run_id}/${artifact}"
            if [[ -e "$destination" ]]; then
              printf 'Retained destination collision.\n' >&2
              exit 1
            fi
            mkdir -p "$destination"
            gh run download "$run_id" --repo "$repository" --name "$artifact" --dir "$destination"
            downloaded[$key]=1
          done < "$RETAINED_LOCATORS_PATH"
      - name: Verify general producer artifact binds the exact event head
        run: |
          set -euo pipefail
          test "$(cat "${{ runner.temp }}/machine-results/producer-head.sha")" = "${{ steps.bounds.outputs.head }}"
      - name: Verify topology producer artifact binds the exact event head when transition-declared
        if: steps.artifacts.outputs.requires_topology == 'true'
        run: |
          set -euo pipefail
          test "$(cat "${{ runner.temp }}/machine-results/topology-primary/producer-head.sha")" = "${{ steps.bounds.outputs.head }}"
      - name: Attest and evaluate proposed completion transitions
        run: >-
          dotnet run --project tools/Hexalith.ChatBot.StoryEvidenceGate/Hexalith.ChatBot.StoryEvidenceGate.csproj
          --configuration Release -- ci
          --base "${{ steps.bounds.outputs.base }}"
          --head "${{ steps.bounds.outputs.head }}"
          --results "${{ runner.temp }}/machine-results"
          --report-directory "${{ runner.temp }}/story-evidence-reports"
      - name: Upload story-evidence reports and provenance sidecars
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-evidence-integrity-reports
          path: |
            ${{ runner.temp }}/story-evidence-reports
            ${{ runner.temp }}/machine-results/recovery-primary
            ${{ runner.temp }}/machine-results/**/*.provenance.json
          retention-days: 30

  topology-acceptance:
    name: required Aspire + DAPR topology acceptance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact topology producer event head
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup checksum-pinned DAPR CLI
        run: bash .github/scripts/install-dapr-cli.sh
      - name: Initialize DAPR runtime
        run: dapr init --runtime-version 1.18.0
      - name: Record DAPR runtime state
        run: docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' --filter name=dapr_
      - name: Run required tenant-bound topology smoke
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.TrivialGovernedCommandAspireE2eTests.TrivialGovernedCommandShouldFlowEndToEndThroughTheRealDaprTopology"
          --settings live-recovery.runsettings
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=topology-acceptance.trx"
          --results-directory TestResults
      - name: Run exact Story 13.2 authenticated production-client matrix
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Story132ProductionBrowserAspireE2ETests.AuthenticatedProductionClientShouldMessageAskAndStopAcrossRequiredChromeMatrix"
          --settings live-recovery.runsettings
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=story132-topology-acceptance.trx"
          --results-directory TestResults
      - name: Require one executed Story 13.2 test and zero skips
        run: >-
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('TestResults/story132-topology-acceptance.trx').getroot(); c=next(x for x in r.iter() if x.tag.endswith('Counters')).attrib; assert c.get('executed') == '1' and c.get('passed') == '1' and c.get('notExecuted') == '0', c"
      - name: Record topology producer head
        run: printf '%s\n' "$(git rev-parse HEAD)" > TestResults/producer-head.sha
      - name: Upload topology acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: topology-acceptance-evidence
          path: TestResults
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-validation:
    # Named distinctly from the release workflow's job: branch protection matches required checks by job
    # NAME, and this copy is gated to schedule/dispatch, so a shared name let a run that is SKIPPED on
    # every push and pull request satisfy a required check meant for the release lane.
    name: scheduled live recovery validation sweep
    needs: build
    # Destructive, serialized, and up to 5.5 hours: run it on the cadence schedule or on explicit dispatch, never on
    # every pull request or push. Running it per-PR made every PR queue a 5.5-hour fault-injection job.
    # workflow_dispatch is a DELIBERATE, disclosed part of the blast radius: any user with write access can launch
    # this destructive 5.5-hour fault-injection lane on demand. Round 3 flagged both halves of that finding; only the
    # least-privilege `permissions` half was applied, and the dispatch half went unrecorded until round 5. It is kept
    # because an on-demand re-run is needed after a failed scheduled sweep, and the job holds `contents: read` only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      # Distinct from the release workflow's group. Sharing one repository-wide group made the required release
      # check queue behind this run for up to 5.5 hours, and GitHub cancels the older of two pending runs.
      group: live-recovery-validation-ci-${{ github.repository }}
      cancel-in-progress: false
    # Least privilege: this job runs multi-hour fault injection and arbitrary submodule code. It needs to read the
    # repository and nothing else; the default token scope would let a compromised step write to it.
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_ARTIFACT: live-recovery-validation-evidence
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Initialize metadata-only live recovery attempt envelope
        env:
          ATTEMPT_PATH: ${{ runner.temp }}/workflow-attempt/producer-attempt.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ATTEMPT_PATH")"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg job "$GITHUB_JOB" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg startedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{schemaVersion:"1.0",kind:"live-recovery-producer-attempt",repository:$repository,commit:$commit,workflow:$workflow,job:$job,runId:$runId,runAttempt:$runAttempt,startedAtUtc:$startedAtUtc,completedAtUtc:null,producerOutcome:"not-started"}' \
            > "$ATTEMPT_PATH"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup checksum-pinned DAPR CLI
        run: bash .github/scripts/install-dapr-cli.sh
      - name: Initialize DAPR runtime
        run: dapr init --runtime-version 1.18.0
      - name: Run all live recovery coordinators and retain evidence
        id: recovery
        # Bounded ladder, innermost first, so the in-process `finally` always wins the race to unwind a
        # half-injected fault: in-process deadline 265m < SIGINT 280m < step 300m < job 330m. Without the
        # inner margin the runner kills the process mid-injection and no restoration step ever runs.
        timeout-minutes: 300
        env:
          HEXALITH_CHATBOT_RECOVERY_WORKFLOW_TIMEOUT_MINUTES: "265"
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=15m 16800s \
            dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj \
            -m:1 \
            --configuration Release \
            --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveContinuityAspireE2eTests.LiveRecoveryValidationRunsAllThreeCoordinatorsAndPassesEvidenceGate" \
            --logger "console;verbosity=minimal" \
            --settings live-recovery.runsettings \
            --logger "trx;LogFileName=live-recovery-validation.trx" \
            --results-directory TestResults
      - name: Finalize metadata-only live recovery attempt envelope
        if: always()
        env:
          ATTEMPT_PATH: ${{ runner.temp }}/workflow-attempt/producer-attempt.json
          PRODUCER_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          temporary_path="${ATTEMPT_PATH}.tmp"
          jq \
            --arg completedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg producerOutcome "${PRODUCER_OUTCOME:-skipped}" \
            '.completedAtUtc=$completedAtUtc | .producerOutcome=$producerOutcome' \
            "$ATTEMPT_PATH" > "$temporary_path"
          mv "$temporary_path" "$ATTEMPT_PATH"
          mkdir -p TestResults/workflow-attempt
          cp "$ATTEMPT_PATH" TestResults/workflow-attempt/producer-attempt.json
      - name: Upload live recovery reports, manifests, and raw test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-recovery-validation-evidence
          path: TestResults
          retention-days: 30
          if-no-files-found: error
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-evidence-gate:
    name: scheduled live recovery evidence gate
    # The authoritative gate. It runs in a SEPARATE job from the run that produced the evidence, reads only the
    # uploaded artifact, applies the thresholds configured here rather than any the run declared about itself, and
    # evaluates against a fresh wall clock so the staleness branches are reachable. Evaluating the gate in-process
    # inside the producing test meant the run supplied its own judge with its own answers.
    #
    # Run after a failed producer too: evidence is uploaded with `if: always()`, and a Contained-breach / red
    # validation must still be judged out of process. Skip only when the producer itself was skipped (push/PR).
    needs: live-recovery-validation
    if: always() && needs.live-recovery-validation.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_REQUIRED: "1"
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_DIR: ${{ github.workspace }}/RetainedEvidence
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASETS: recovery-baseline
      HEXALITH_CHATBOT_RECOVERY_MAX_EVIDENCE_AGE_HOURS: "192"
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASET_VERSION: v1
      HEXALITH_CHATBOT_RECOVERY_MINIMUM_DATASET_VOLUME: "6"
      HEXALITH_CHATBOT_RECOVERY_MAX_MEASURABLE_CEILING_SECONDS: "180"
      HEXALITH_CHATBOT_RECOVERY_REQUIRED_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Download retained live recovery evidence
        uses: actions/download-artifact@v8
        with:
          name: live-recovery-validation-evidence
          path: RetainedEvidence
      - name: Evaluate the release evidence gate out of process
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveRecoveryEvidenceGateReplayTests.RetainedLiveRecoveryEvidenceShouldPassTheReleaseGateOutOfProcess"
          --logger "console;verbosity=detailed"
          --settings live-recovery.runsettings
          --logger "trx;LogFileName=live-recovery-evidence-gate.trx"
          --results-directory GateResults
      - name: Upload the gate decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-recovery-evidence-gate-decision
          path: GateResults
          retention-days: 30
