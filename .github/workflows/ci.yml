name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - next
      - alpha
      - beta
  # The destructive live-recovery lane is scheduled, never per-PR. The cadence matches
  # LiveRecoveryValidationOptions.Cadence (7 days) so the configured value governs something real.
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  HexalithCommonsRoot: ${{ github.workspace }}/references/Hexalith.Commons
  # Build the Hexalith dependencies from the references/ source submodules rather than from published NuGet packages.
  #
  # Required, not preferred: Hexalith.Tenants references Hexalith.EventStore.Gateway, first published at 3.82.0, while
  # the shared Hexalith.Builds catalog still pins the EventStore package family at 3.78.0 and carries no PackageVersion
  # entry for Gateway at all. In package mode that fails Central Package Management with NU1010, breaking the whole
  # solution restore and everything downstream of Tenants (including Hexalith.ChatBot.IntegrationTests). With this set,
  # each affected csproj takes its ProjectReference branch (gated on HexalithEventStoreFromSource) against
  # references/Hexalith.EventStore, which is checked out at v3.86.0 and does contain the Gateway project.
  #
  # It is set here as an environment variable on purpose: every submodule ships its own Directory.Build.props and
  # Directory.Packages.props that shadow this repository's root files, so the property cannot be set from them. An
  # environment variable reaches MSBuild as a global property; Directory.Build.rsp does not work because the dotnet CLI
  # does not read auto-response files.
  #
  # The durable fix belongs in the Hexalith.Builds repository: add Hexalith.EventStore.Gateway to its catalog and align
  # HexalithEventStoreVersion with the checked-out submodule. Remove this once that lands, if package mode is preferred.
  UseHexalithProjectReferences: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore Hexalith.ChatBot.slnx
      - name: Build
        run: dotnet build Hexalith.ChatBot.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Hexalith.ChatBot.slnx --no-build --configuration Release

  topology-acceptance:
    name: required Aspire + DAPR topology acceptance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup DAPR CLI
        uses: dapr/setup-dapr@v2
      - name: Initialize DAPR runtime
        run: dapr init
      - name: Record DAPR runtime state
        run: docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' --filter name=dapr_
      - name: Run required tenant-bound topology smoke
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.TrivialGovernedCommandAspireE2eTests.TrivialGovernedCommandShouldFlowEndToEndThroughTheRealDaprTopology"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=topology-acceptance.trx"
          --results-directory TestResults
      - name: Upload topology acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-acceptance-evidence
          path: TestResults
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-validation:
    name: required serialized live recovery evidence gate
    needs: build
    # Destructive, serialized, and up to 5.5 hours: run it on the cadence schedule or on explicit dispatch, never on
    # every pull request or push. Running it per-PR made every PR queue a 5.5-hour fault-injection job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      # Distinct from the release workflow's group. Sharing one repository-wide group made the required release
      # check queue behind this run for up to 5.5 hours, and GitHub cancels the older of two pending runs.
      group: live-recovery-validation-ci-${{ github.repository }}
      cancel-in-progress: false
    # Least privilege: this job runs multi-hour fault injection and arbitrary submodule code. It needs to read the
    # repository and nothing else; the default token scope would let a compromised step write to it.
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_TIER3: "1"
      HEXALITH_CHATBOT_TIER3_REQUIRED: "1"
      ChatBotServiceGrants__LifetimeDays: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Setup DAPR CLI
        uses: dapr/setup-dapr@v2
      - name: Initialize DAPR runtime
        run: dapr init
      - name: Run all live recovery coordinators and fail-closed evidence gate
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveContinuityAspireE2eTests.LiveRecoveryValidationRunsAllThreeCoordinatorsAndPassesEvidenceGate"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=live-recovery-validation.trx"
          --results-directory TestResults
      - name: Upload live recovery reports, manifests, and raw test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-recovery-validation-evidence
          path: TestResults
          retention-days: 30
      - name: Stop DAPR runtime
        if: always()
        run: dapr uninstall --all

  live-recovery-evidence-gate:
    name: required independent live recovery evidence gate
    # The authoritative gate. It runs in a SEPARATE job from the run that produced the evidence, reads only the
    # uploaded artifact, applies the thresholds configured here rather than any the run declared about itself, and
    # evaluates against a fresh wall clock so the staleness branches are reachable. Evaluating the gate in-process
    # inside the producing test meant the run supplied its own judge with its own answers.
    needs: live-recovery-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_REQUIRED: "1"
      HEXALITH_CHATBOT_RECOVERY_EVIDENCE_DIR: ${{ github.workspace }}/RetainedEvidence
      HEXALITH_CHATBOT_RECOVERY_EXPECTED_DATASETS: recovery-baseline
      HEXALITH_CHATBOT_RECOVERY_MAX_EVIDENCE_AGE_HOURS: "192"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize references submodules
        run: git submodule update --init
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Download retained live recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: live-recovery-validation-evidence
          path: RetainedEvidence
      - name: Evaluate the release evidence gate out of process
        run: >-
          dotnet test tests/Hexalith.ChatBot.IntegrationTests/Hexalith.ChatBot.IntegrationTests.csproj
          -m:1
          --configuration Release
          --filter "FullyQualifiedName=Hexalith.ChatBot.IntegrationTests.Recovery.LiveRecoveryEvidenceGateReplayTests.RetainedLiveRecoveryEvidenceShouldPassTheReleaseGateOutOfProcess"
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=live-recovery-evidence-gate.trx"
          --results-directory GateResults
      - name: Upload the gate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-recovery-evidence-gate-decision
          path: GateResults
          retention-days: 30
