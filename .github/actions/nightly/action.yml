name: ChatBot release and weekly recovery validation
description: Run daily positive-state release gates and independently preserve the Sunday destructive recovery sweep.
runs:
  using: composite
  steps:
    - name: Require live topology and browser prerequisites
      id: runtime
      shell: bash
      run: python3 .github/actions/after-unit-tests/require-runtime.py
    - name: Run the complete positive-state release project
      shell: bash
      run: bash .github/actions/nightly/run-release.sh
    - name: Run the complete recovery project when the weekly sweep is due
      if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
      shell: bash
      env:
        HEXALITH_CHATBOT_RECOVERY_WORKFLOW_TIMEOUT_MINUTES: '250'
      run: bash .github/actions/nightly/run-recovery.sh
    - name: Upload the bounded recovery bundle
      if: ${{ !cancelled() && env.CHATBOT_RECOVERY_BUNDLE_DIR != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: live-recovery-validation-evidence
        path: ${{ env.CHATBOT_RECOVERY_BUNDLE_DIR }}
        if-no-files-found: error
        retention-days: 30
