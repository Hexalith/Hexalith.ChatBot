openapi: 3.1.0
info:
  title: Hexalith.ChatBot API
  version: v1
  summary: Contract Spine foundation for governed chatbot command submission.
  description: >
    Canonical OpenAPI 3.1 foundation for Hexalith.ChatBot. This document defines
    the smallest adapter-facing command submission surface for structural parity.
    Tenant authority comes from authenticated context and later authoritative
    processing metadata, never from request bodies, query parameters, or
    client-controlled headers.
servers:
  - url: /api/v1
    description: URL-versioned REST surface. Deployment hosts, issuer values, and audience values are supplied by environment configuration.
tags:
  - name: commands
    description: Adapter-facing command submission contracts.
  - name: operations
    description: Tenant-scoped long-running operation status contracts.
  - name: projects
    description: Tenant-scoped project conversation read contracts.
security:
  - oidcBearer: []
paths:
  /api/v1/commands:
    post:
      tags:
        - commands
      operationId: SubmitCommand
      summary: Submit a typed ChatBot command for governed processing.
      description: >
        Accepts a typed ChatBot command shape from an adapter and returns accepted
        metadata. The operation records only contract-level submission intent; it
        does not execute domain behavior or expose internal processing stages.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandSubmissionRequest"
            examples:
              synthetic:
                $ref: "#/components/examples/CommandSubmissionRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedCommand"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/InternalFailure"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-command-submission:
        adapterContract: IChatBotClient.SubmitAsync
        commandMarker: IChatBotCommand
        tenantAuthority: authenticated-context
        runtimeBehavior: deferred-to-later-stories
      x-hexalith-correlation:
        correlationHeader: X-Correlation-Id
        taskHeader: X-Hexalith-Task-Id
        adapterBehavior: caller-provided-or-generated-correlation
      x-hexalith-canonical-error-categories:
        - authentication_failure
        - authorization_denied
        - validation_error
        - conflict
        - internal_error
  /api/v1/operations/{operationId}:
    get:
      tags:
        - operations
      operationId: GetOperationStatus
      summary: Read metadata-only status for a tracked operation.
      description: >
        Returns tenant-scoped operation status metadata without exposing command
        command content or confirming whether an operation exists outside the caller's
        authenticated tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Opaque operation identifier.
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskId"
              - $ref: "#/components/schemas/CommandId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/OperationStatus"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-operation-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
  /api/v1/operations/{operationId}/audit-history:
    get:
      tags:
        - operations
      operationId: GetOperationAuditHistory
      summary: Read the metadata-only post-commit audit-history summary for a tracked operation.
      description: >
        Returns a tenant-scoped, redacted, metadata-only summary of the operation's
        post-commit audit envelope(s). It exposes stable codes and opaque identifiers
        only — never command content, tenant or resource names — and never confirms
        whether an operation exists outside the caller's authenticated tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Opaque operation identifier.
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskId"
              - $ref: "#/components/schemas/CommandId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/OperationAuditHistory"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-operation-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
  /api/v1/associations/{associationId}/routing-status:
    get:
      tags:
        - operations
      operationId: GetAssociationRoutingStatus
      summary: Read metadata-only association routing status.
      description: >
        Returns tenant-scoped, metadata-only association routing status for the
        S2 review surface. The response carries only authorized candidates,
        safe evidence references, lifecycle/status codes, and safe next-action
        reasons; unknown, invalid, or cross-tenant identifiers collapse to the
        same safe authorization denial.
      parameters:
        - name: associationId
          in: path
          required: true
          description: Opaque association workflow identifier.
          schema:
            $ref: "#/components/schemas/AssociationWorkflowId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/AssociationRoutingStatus"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-association-routing-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
        uiSurface: S2
  /api/v1/projects/{projectId}/conversation:
    get:
      tags:
        - projects
      operationId: GetProjectConversation
      summary: Read metadata-only project conversation context.
      description: >
        Returns tenant-scoped, project-partitioned S1 conversation context derived
        from governed email association metadata. The response never includes raw
        provider content, email bodies, unauthorized project names, tenant names,
        or cross-tenant cursor material.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Authorized project identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: cursor
          in: query
          required: false
          description: Opaque project-scoped pagination cursor.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: pageSize
          in: query
          required: false
          description: Maximum number of metadata-only conversation items to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/ProjectConversation"
        "304":
          $ref: "#/components/responses/ProjectConversationNotModified"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-project-conversation:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        partitionKeyShape: "{tenant}:project-conversation:{projectId}:{itemId}"
        pagination: cursor
        uiSurface: S1
  /api/v1/projects/{projectId}/task-intents/{taskIntentId}:
    get:
      tags:
        - projects
      operationId: GetTaskIntentReview
      summary: Read authorized task-intent review metadata and source content.
      description: >
        Returns complete task-intent metadata plus the full source message only
        for an authorized review surface. Unknown, foreign, stale, redacted,
        quarantined, or unavailable source state collapses to a safe unavailable
        review response without confirming restricted resource existence.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: taskIntentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/TaskIntentReview"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-task-intent-review:
        tenantAuthority: authenticated-context
        responseVisibility: authorized-review-only
        unknownOrCrossTenantResult: safe_unavailable
        uiSurface: S1
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OpenID Connect bearer token supplied by the hosting environment.
  headers:
    CorrelationId:
      description: Opaque correlation identifier for support-safe tracing.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    TaskId:
      description: Opaque long-running task identifier when a submitted command is tracked asynchronously.
      schema:
        $ref: "#/components/schemas/TaskId"
    RetryAfter:
      description: Retry guidance in seconds when the caller can safely retry.
      schema:
        type: integer
        format: int32
        minimum: 1
    ETag:
      description: Opaque project conversation version tag for conditional reads.
      schema:
        type: string
        minLength: 3
        maxLength: 128
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Opaque caller-supplied or client-generated correlation identifier.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    TaskId:
      name: X-Hexalith-Task-Id
      in: header
      required: false
      description: Opaque caller-supplied task identifier for long-running operation tracking.
      schema:
        $ref: "#/components/schemas/TaskId"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Previously returned project conversation ETag for conditional reads.
      schema:
        type: string
        minLength: 3
        maxLength: 128
  responses:
    AcceptedCommand:
      description: Command submission accepted for later governed processing.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandSubmissionResponse"
          examples:
            synthetic:
              $ref: "#/components/examples/AcceptedCommand"
    ValidationFailure:
      description: Metadata-only validation failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/ValidationProblem"
    SafeAuthorizationDenial401:
      description: Metadata-only authentication failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/AuthenticationProblem"
    SafeAuthorizationDenial403:
      description: Metadata-only authorization denial.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/AuthorizationProblem"
    Conflict:
      description: Metadata-only conflict response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/ConflictProblem"
    InternalFailure:
      description: Metadata-only internal failure response.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/InternalProblem"
    OperationStatus:
      description: Metadata-only long-running operation status.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationStatus"
          examples:
            projectionPending:
              $ref: "#/components/examples/OperationStatusProjectionPending"
    OperationAuditHistory:
      description: Metadata-only post-commit audit-history summary.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationAuditHistory"
          examples:
            postCommit:
              $ref: "#/components/examples/OperationAuditHistoryPostCommit"
    AssociationRoutingStatus:
      description: Metadata-only association routing status.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssociationRoutingStatus"
    ProjectConversation:
      description: Metadata-only project conversation context.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectConversationResponse"
    ProjectConversationNotModified:
      description: Project conversation has not changed for the supplied entity tag.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    TaskIntentReview:
      description: Authorized task-intent review response.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskIntentReview"
  schemas:
    CommandSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - commandId
        - commandType
        - command
        - requestSchemaVersion
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        commandType:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Z][A-Za-z0-9]*$"
          description: Imperative command contract type name without the Command suffix.
          not:
            pattern: "Command$"
        command:
          type: object
          additionalProperties: true
          description: Typed command body supplied through IChatBotCommand.
        requestSchemaVersion:
          type: string
          enum:
            - v1
        actorType:
          $ref: "#/components/schemas/ActorType"
        riskClass:
          $ref: "#/components/schemas/RiskClass"
        thresholdBand:
          $ref: "#/components/schemas/ThresholdBand"
        origin:
          $ref: "#/components/schemas/SurfaceOrigin"
    CommandSubmissionResponse:
      allOf:
        - $ref: "#/components/schemas/AcceptedCommand"
    AcceptedCommand:
      type: object
      additionalProperties: false
      required:
        - commandId
        - correlationId
        - lifecycleState
        - acceptedAt
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        taskId:
          $ref: "#/components/schemas/TaskId"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        acceptedAt:
          type: string
          format: date-time
          description: UTC acceptance timestamp.
    TaskIntentState:
      type: string
      description: Durable task-intent lifecycle state.
      enum:
        - captured
        - rejected
        - blocked
        - converted
        - not-actionable
        - duplicate
        - already-handled
        - out-of-scope
    TaskIntentSourceEvidenceOffset:
      type: object
      additionalProperties: false
      required:
        - evidenceReference
      properties:
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 256
          description: Metadata-only evidence reference or offset token.
        startOffset:
          type: integer
          format: int32
          minimum: 0
        endOffset:
          type: integer
          format: int32
          minimum: 0
        token:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[a-zA-Z0-9:._-]+$"
    TaskIntentRecord:
      type: object
      additionalProperties: false
      required:
        - taskIntentId
        - tenantId
        - projectId
        - sourceMessageId
        - requesterPartyId
        - detectedIntentSummary
        - detectedActionKind
        - sourceEvidenceOffsets
        - kernelVersion
        - confidenceScore
        - detectedAt
        - state
        - schemaVersion
        - reasonCode
        - sourceProvenance
        - redactionState
        - retentionClass
        - sourceVersion
        - correlationId
      properties:
        taskIntentId:
          type: string
          minLength: 1
          maxLength: 160
        tenantId:
          type: string
          minLength: 1
          maxLength: 256
        projectId:
          type: string
          minLength: 1
          maxLength: 256
        sourceMessageId:
          type: string
          minLength: 1
          maxLength: 256
        requesterPartyId:
          type: string
          minLength: 1
          maxLength: 256
        detectedIntentSummary:
          type: string
          minLength: 1
          maxLength: 280
          description: Safe summary generated from metadata-only deterministic signals; never raw source text.
        detectedActionKind:
          $ref: "#/components/schemas/ProjectConversationDetectedActionKind"
        sourceEvidenceOffsets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TaskIntentSourceEvidenceOffset"
        kernelVersion:
          type: string
          minLength: 1
          maxLength: 120
        confidenceScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
        detectedAt:
          type: string
          format: date-time
          description: UTC detection timestamp.
        state:
          $ref: "#/components/schemas/TaskIntentState"
        schemaVersion:
          type: string
          minLength: 1
          maxLength: 120
        reasonCode:
          $ref: "#/components/schemas/ChatBotMessageCode"
        sourceProvenance:
          type: string
          minLength: 1
          maxLength: 120
        redactionState:
          type: string
          enum:
            - metadata_only
            - redacted
            - unavailable
        retentionClass:
          type: string
          minLength: 1
          maxLength: 120
        sourceVersion:
          type: integer
          format: int64
          minimum: 1
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        policySnapshotId:
          type: string
          minLength: 1
          maxLength: 256
        correctionLineageId:
          type: string
          minLength: 1
          maxLength: 256
        conversionReadinessBlocked:
          type: boolean
        safeNextAction:
          $ref: "#/components/schemas/ChatBotMessageNextAction"
        supersedesTaskIntentId:
          type: string
          minLength: 1
          maxLength: 160
        supersededByTaskIntentId:
          type: string
          minLength: 1
          maxLength: 160
        convertedProposalId:
          type: string
          minLength: 1
          maxLength: 256
        duplicatePredecessorTaskIntentId:
          type: string
          minLength: 1
          maxLength: 160
        reviewerActorId:
          type: string
          minLength: 1
          maxLength: 256
        decidedAtUtc:
          type: string
          format: date-time
        auditOperationId:
          type: string
          minLength: 1
          maxLength: 256
        transitionId:
          type: string
          minLength: 1
          maxLength: 256
    CaptureTaskIntent:
      type: object
      additionalProperties: false
      required:
        - projectId
        - sourceMessageId
        - requesterPartyId
        - detectedIntentSummary
        - detectedActionKind
        - sourceEvidenceOffsets
        - kernelVersion
        - confidenceScore
        - detectedAt
        - redactionState
        - retentionClass
        - sourceVersion
        - correlationId
        - correctedContextReady
        - schemaVersion
      properties:
        projectId:
          type: string
          minLength: 1
          maxLength: 256
        sourceMessageId:
          type: string
          minLength: 1
          maxLength: 256
        requesterPartyId:
          type: string
          minLength: 1
          maxLength: 256
        detectedIntentSummary:
          type: string
          minLength: 1
          maxLength: 280
        detectedActionKind:
          $ref: "#/components/schemas/ProjectConversationDetectedActionKind"
        sourceEvidenceOffsets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TaskIntentSourceEvidenceOffset"
        kernelVersion:
          type: string
          minLength: 1
          maxLength: 120
        confidenceScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
        detectedAt:
          type: string
          format: date-time
        redactionState:
          type: string
          enum:
            - metadata_only
            - redacted
            - unavailable
        retentionClass:
          type: string
          minLength: 1
          maxLength: 120
        sourceVersion:
          type: integer
          format: int64
          minimum: 1
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        policySnapshotId:
          type: string
          minLength: 1
          maxLength: 256
        correctedContextReady:
          type: boolean
        schemaVersion:
          type: string
          minLength: 1
          maxLength: 120
    ProposeAIAction:
      type: object
      additionalProperties: false
      required:
        - projectId
        - taskIntentId
        - sourceMessageId
        - requesterId
        - intendedCommandName
        - actionKind
        - expectedSourceVersion
        - evidenceReferences
        - affectedResourceReferences
        - recipientReferences
        - correlationId
        - transitionId
      properties:
        projectId:
          type: string
          minLength: 1
          maxLength: 256
        taskIntentId:
          type: string
          minLength: 1
          maxLength: 256
        sourceMessageId:
          type: string
          minLength: 1
          maxLength: 256
        requesterId:
          type: string
          minLength: 1
          maxLength: 256
        intendedCommandName:
          type: string
          minLength: 1
          maxLength: 160
        actionKind:
          type: string
          minLength: 1
          maxLength: 160
        expectedSourceVersion:
          type: integer
          format: int64
          minimum: 1
        evidenceReferences:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 256
        affectedResourceReferences:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        recipientReferences:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        policySnapshotId:
          type: string
          minLength: 1
          maxLength: 256
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        transitionId:
          type: string
          minLength: 1
          maxLength: 256
        sourceConversationItemId:
          type: string
          minLength: 1
          maxLength: 256
        proposalInputMetadata:
          type: object
          additionalProperties:
            type: string
        proposedActionClasses:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AiActionRiskActionClass"
        effectSurface:
          type: string
          minLength: 1
          maxLength: 120
        tenantPolicyClassification:
          type: string
          minLength: 1
          maxLength: 120
        commandAllowlistVersion:
          type: string
          minLength: 1
          maxLength: 120
        commandDefaultRisk:
          $ref: "#/components/schemas/AiActionRiskClass"
        commandMetadataSupported:
          type: boolean
        riskClassification:
          $ref: "#/components/schemas/AiActionRiskClassificationRecord"
        redactionState:
          type: string
          enum:
            - metadata_only
            - redacted
            - unavailable
        retentionClass:
          type: string
          minLength: 1
          maxLength: 120
        schemaVersion:
          type: string
          minLength: 1
          maxLength: 120
    MarkTaskIntentDisposition:
      type: object
      additionalProperties: false
      required:
        - projectId
        - taskIntentId
        - sourceMessageId
        - disposition
        - expectedSourceVersion
        - evidenceReferences
        - correlationId
        - transitionId
      properties:
        projectId:
          type: string
          minLength: 1
          maxLength: 256
        taskIntentId:
          type: string
          minLength: 1
          maxLength: 256
        sourceMessageId:
          type: string
          minLength: 1
          maxLength: 256
        disposition:
          type: string
          enum:
            - not-actionable
            - duplicate
            - already-handled
            - out-of-scope
        expectedSourceVersion:
          type: integer
          format: int64
          minimum: 1
        evidenceReferences:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 256
        policySnapshotId:
          type: string
          minLength: 1
