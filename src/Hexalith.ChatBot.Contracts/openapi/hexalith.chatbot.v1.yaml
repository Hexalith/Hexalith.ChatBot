openapi: 3.1.0
info:
  title: Hexalith.ChatBot API
  version: v1
  summary: Contract Spine foundation for governed chatbot command submission.
  description: >
    Canonical OpenAPI 3.1 foundation for Hexalith.ChatBot. This document defines
    the smallest adapter-facing command submission surface for structural parity.
    Tenant authority comes from authenticated context and later authoritative
    processing metadata, never from request bodies, query parameters, or
    client-controlled headers.
servers:
  - url: /api/v1
    description: URL-versioned REST surface. Deployment hosts, issuer values, and audience values are supplied by environment configuration.
tags:
  - name: commands
    description: Adapter-facing command submission contracts.
  - name: operations
    description: Tenant-scoped long-running operation status contracts.
security:
  - oidcBearer: []
paths:
  /api/v1/commands:
    post:
      tags:
        - commands
      operationId: SubmitCommand
      summary: Submit a typed ChatBot command for governed processing.
      description: >
        Accepts a typed ChatBot command shape from an adapter and returns accepted
        metadata. The operation records only contract-level submission intent; it
        does not execute domain behavior or expose internal processing stages.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandSubmissionRequest"
            examples:
              synthetic:
                $ref: "#/components/examples/CommandSubmissionRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedCommand"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/InternalFailure"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-command-submission:
        adapterContract: IChatBotClient.SubmitAsync
        commandMarker: IChatBotCommand
        tenantAuthority: authenticated-context
        runtimeBehavior: deferred-to-later-stories
      x-hexalith-correlation:
        correlationHeader: X-Correlation-Id
        taskHeader: X-Hexalith-Task-Id
        adapterBehavior: caller-provided-or-generated-correlation
      x-hexalith-canonical-error-categories:
        - authentication_failure
        - authorization_denied
        - validation_error
        - conflict
        - internal_error
  /api/v1/operations/{operationId}:
    get:
      tags:
        - operations
      operationId: GetOperationStatus
      summary: Read metadata-only status for a tracked operation.
      description: >
        Returns tenant-scoped operation status metadata without exposing command
        command content or confirming whether an operation exists outside the caller's
        authenticated tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Opaque operation identifier.
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskId"
              - $ref: "#/components/schemas/CommandId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/OperationStatus"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-operation-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
  /api/v1/operations/{operationId}/audit-history:
    get:
      tags:
        - operations
      operationId: GetOperationAuditHistory
      summary: Read the metadata-only post-commit audit-history summary for a tracked operation.
      description: >
        Returns a tenant-scoped, redacted, metadata-only summary of the operation's
        post-commit audit envelope(s). It exposes stable codes and opaque identifiers
        only — never command content, tenant or resource names — and never confirms
        whether an operation exists outside the caller's authenticated tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Opaque operation identifier.
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskId"
              - $ref: "#/components/schemas/CommandId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/OperationAuditHistory"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-operation-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OpenID Connect bearer token supplied by the hosting environment.
  headers:
    CorrelationId:
      description: Opaque correlation identifier for support-safe tracing.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    TaskId:
      description: Opaque long-running task identifier when a submitted command is tracked asynchronously.
      schema:
        $ref: "#/components/schemas/TaskId"
    RetryAfter:
      description: Retry guidance in seconds when the caller can safely retry.
      schema:
        type: integer
        format: int32
        minimum: 1
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Opaque caller-supplied or client-generated correlation identifier.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    TaskId:
      name: X-Hexalith-Task-Id
      in: header
      required: false
      description: Opaque caller-supplied task identifier for long-running operation tracking.
      schema:
        $ref: "#/components/schemas/TaskId"
  responses:
    AcceptedCommand:
      description: Command submission accepted for later governed processing.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandSubmissionResponse"
          examples:
            synthetic:
              $ref: "#/components/examples/AcceptedCommand"
    ValidationFailure:
      description: Metadata-only validation failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/ValidationProblem"
    SafeAuthorizationDenial401:
      description: Metadata-only authentication failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/AuthenticationProblem"
    SafeAuthorizationDenial403:
      description: Metadata-only authorization denial.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/AuthorizationProblem"
    Conflict:
      description: Metadata-only conflict response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/ConflictProblem"
    InternalFailure:
      description: Metadata-only internal failure response.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/InternalProblem"
    OperationStatus:
      description: Metadata-only long-running operation status.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationStatus"
          examples:
            projectionPending:
              $ref: "#/components/examples/OperationStatusProjectionPending"
    OperationAuditHistory:
      description: Metadata-only post-commit audit-history summary.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationAuditHistory"
          examples:
            postCommit:
              $ref: "#/components/examples/OperationAuditHistoryPostCommit"
  schemas:
    CommandSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - commandId
        - commandType
        - command
        - requestSchemaVersion
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        commandType:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Z][A-Za-z0-9]*$"
          description: Imperative command contract type name without the Command suffix.
          not:
            pattern: "Command$"
        command:
          type: object
          additionalProperties: true
          description: Typed command body supplied through IChatBotCommand.
        requestSchemaVersion:
          type: string
          enum:
            - v1
        actorType:
          $ref: "#/components/schemas/ActorType"
        riskClass:
          $ref: "#/components/schemas/RiskClass"
        thresholdBand:
          $ref: "#/components/schemas/ThresholdBand"
        origin:
          $ref: "#/components/schemas/SurfaceOrigin"
    CommandSubmissionResponse:
      allOf:
        - $ref: "#/components/schemas/AcceptedCommand"
    AcceptedCommand:
      type: object
      additionalProperties: false
      required:
        - commandId
        - correlationId
        - lifecycleState
        - acceptedAt
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        taskId:
          $ref: "#/components/schemas/TaskId"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        acceptedAt:
          type: string
          format: date-time
          description: UTC acceptance timestamp.
    OperationStatus:
      type: object
      additionalProperties: false
      required:
        - operationId
        - commandId
        - correlationId
        - lifecycleState
        - retryCount
        - completionStatus
        - auditStatus
        - partialOutputs
        - safeNextActions
        - acceptedAt
        - lastUpdatedAt
      properties:
        operationId:
          oneOf:
            - $ref: "#/components/schemas/TaskId"
            - $ref: "#/components/schemas/CommandId"
        commandId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        retryCount:
          type: integer
          format: int32
          minimum: 0
        completionStatus:
          $ref: "#/components/schemas/OperationCompletionStatus"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
        partialOutputs:
          $ref: "#/components/schemas/OperationStatusPartialOutputs"
        safeNextActions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatBotMessageNextAction"
        terminalReason:
          $ref: "#/components/schemas/ChatBotMessageCode"
        acceptedAt:
          type: string
          format: date-time
          description: UTC acceptance timestamp.
        lastUpdatedAt:
          type: string
          format: date-time
          description: UTC last status update timestamp.
    OperationStatusPartialOutputs:
      type: object
      additionalProperties: false
      required:
        - acceptedAt
        - completionStatus
        - auditStatus
      properties:
        acceptedAt:
          type: string
          format: date-time
        completionStatus:
          $ref: "#/components/schemas/OperationCompletionStatus"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
    OperationAuditHistory:
      type: object
      additionalProperties: false
      required:
        - operationId
        - auditStatus
        - entries
      properties:
        operationId:
          oneOf:
            - $ref: "#/components/schemas/TaskId"
            - $ref: "#/components/schemas/CommandId"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
        entries:
          type: array
          description: Post-commit audit envelope summaries for the operation, in record order.
          items:
            $ref: "#/components/schemas/AuditHistoryEntry"
    AuditHistoryEntry:
      type: object
      additionalProperties: false
      required:
        - phase
        - decision
        - reasonCode
        - outcome
        - stateTransition
        - redactionDecision
        - surfaceOrigin
        - resourceId
        - correlationId
        - recordedAt
      properties:
        phase:
          $ref: "#/components/schemas/AuditHistoryPhase"
        decision:
          type: string
          minLength: 1
          maxLength: 40
          description: Stable audit decision code (e.g. allow, reject).
        reasonCode:
          type: string
          minLength: 1
          maxLength: 80
          description: Stable audit reason code.
        outcome:
          type: string
          minLength: 1
          maxLength: 40
          description: Stable audit outcome code.
        stateTransition:
          type: string
          minLength: 1
          maxLength: 80
          description: Lifecycle state-transition code carried by the envelope.
        redactionDecision:
          type: string
          enum:
            - metadata_only
        surfaceOrigin:
          $ref: "#/components/schemas/SurfaceOrigin"
        resourceId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        recordedAt:
          type: string
          format: date-time
          description: UTC audit record timestamp.
    AuditHistoryPhase:
      type: string
      enum:
        - pre-commit
        - post-commit
    OperationCompletionStatus:
      type: string
      enum:
        - accepted-projection-pending
        - completed
        - failed
    OperationAuditStatus:
      type: string
      enum:
        - committed
        - reconciling
    ChatBotMessageNextAction:
      type: string
      enum:
        - authenticate
        - retry-later
        - request-access
        - escalate
        - dismiss
        - correct-request
        - none
    ChatBotMessageCode:
      type: string
      enum:
        - authentication_denied
        - authorization_denied
        - audit_unavailable
        - idempotency_conflict_command_execution
        - invalid_lifecycle_transition
        - refusal_blocked_action
        - dependency_degraded
        - failed_attachment
        - failed_command
        - degraded_mailbox
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - category
        - code
        - message
        - correlationId
        - retryable
        - clientAction
        - details
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
          maxLength: 240
        instance:
          type: string
          format: uri-reference
        category:
          type: string
          enum:
            - authentication_failure
            - authorization_denied
            - validation_error
            - conflict
            - internal_error
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
          minLength: 1
          maxLength: 240
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        taskId:
          $ref: "#/components/schemas/TaskId"
        retryable:
          type: boolean
        clientAction:
          type: string
          enum:
            - authenticate
            - retry-later
            - request-access
            - escalate
            - dismiss
            - correct-request
            - none
        details:
          $ref: "#/components/schemas/ProblemDetailsDetails"
    ProblemDetailsDetails:
      type: object
      additionalProperties: false
      required:
        - visibility
      properties:
        visibility:
          type: string
          enum:
            - metadata_only
    CommandId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    CorrelationId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    TaskId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    LifecycleState:
      type: string
      enum:
        - Received
        - Proposed
        - Associated
        - Rejected
        - Deferred
        - NeedsReview
        - Failed
        - Skipped
        - Corrected
        - Correcting
        - Correction-delayed
    ChatBotHealthStatus:
      type: string
      enum:
        - healthy
        - degraded
        - failed
        - unknown
    RiskClass:
      type: string
      enum:
        - none
        - low
        - medium
        - high
        - blocked
    ActorType:
      type: string
      enum:
        - human
        - ai
        - service
        - system
    ThresholdBand:
      type: string
      enum:
        - below
        - within
        - above
        - critical
    SurfaceOrigin:
      type: string
      description: >-
        Adapter-declared surface origin (FR85 / S7), captured at the boundary as provenance. M0
        exercises ui and api; the remaining values are reserved. An absent or unknown value is
        treated as api by the server.
      enum:
        - api
        - ui
        - cli
        - mcp
        - worker
        - mailbox
        - ai
  examples:
    CommandSubmissionRequest:
      summary: Synthetic command submission.
      value:
        commandId: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        commandType: StartConversationIntake
        command:
          sourceKind: synthetic
          requestedAction: start_intake
        requestSchemaVersion: v1
        actorType: service
        riskClass: low
        thresholdBand: within
        origin: ui
    AcceptedCommand:
      summary: Synthetic accepted command.
      value:
        commandId: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        correlationId: 01ARZ3NDEKTSV4RRFFQ69G5FAW
        taskId: 01ARZ3NDEKTSV4RRFFQ69G5FAX
        lifecycleState: Proposed
        acceptedAt: "2026-05-30T00:00:00Z"
    OperationStatusProjectionPending:
      summary: Synthetic projection-pending operation status.
      value:
        operationId: 01ARZ3NDEKTSV4RRFFQ69G5FAX
        commandId: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        correlationId: 01ARZ3NDEKTSV4RRFFQ69G5FAW
        lifecycleState: Proposed
        retryCount: 0
        completionStatus: accepted-projection-pending
        auditStatus: committed
        partialOutputs:
          acceptedAt: "2026-05-30T00:00:00Z"
          completionStatus: accepted-projection-pending
          auditStatus: committed
        safeNextActions:
          - none
        acceptedAt: "2026-05-30T00:00:00Z"
        lastUpdatedAt: "2026-05-30T00:00:00Z"
    OperationAuditHistoryPostCommit:
      summary: Synthetic post-commit audit-history summary.
      value:
        operationId: 01ARZ3NDEKTSV4RRFFQ69G5FAX
        auditStatus: committed
        entries:
          - phase: post-commit
            decision: allow
            reasonCode: eventstore_dispatch_accepted
            outcome: proposed
            stateTransition: Received->Proposed
            redactionDecision: metadata_only
            surfaceOrigin: ui
            resourceId: 01ARZ3NDEKTSV4RRFFQ69G5FAZ
            correlationId: 01ARZ3NDEKTSV4RRFFQ69G5FAW
            recordedAt: "2026-05-30T00:00:00Z"
    ValidationProblem:
      summary: Synthetic validation problem.
      value:
        type: about:blank
        title: Validation failed
        status: 400
        detail: Request metadata did not satisfy the contract.
        instance: urn:hexalith:chatbot:problem:synthetic-validation
        category: validation_error
        code: command_contract_invalid
        message: Correct the request metadata and retry.
        correlationId: 01ARZ3NDEKTSV4RRFFQ69G5FAW
        retryable: false
        clientAction: correct-request
        details:
          visibility: metadata_only
    AuthenticationProblem:
      summary: Synthetic authentication problem.
      value:
        type: about:blank
        title: Authentication required.
        status: 401
        category: authentication_failure
        code: authentication_denied
        message: Authentication is required before this operation can continue.
        correlationId: 01ARZ3NDEKTSV4RRFFQ69G5FAW
        retryable: false
        clientAction: authenticate
        details:
          visibility: metadata_only
    AuthorizationProblem:
      summary: Synthetic authorization problem.
      value:
        type: about:blank
        title: Authorization denied.
        status: 403
        category: authorization_denied
        code: authorization_denied
        message: The operation is not available to this caller.
        correlationId: 01ARZ3NDEKTSV4RRFFQ69G5FAW
        retryable: false
        clientAction: request-access
        details:
          visibility: metadata_only
    ConflictProblem:
      summary: Synthetic conflict problem.
      value:
        type: about:blank
        title: Idempotency conflict.
        status: 409
        category: conflict
        code: idempotency_conflict_command_execution
        message: The command conflicts with an existing submission record.
        correlationId: 01ARZ3NDEKTSV4RRFFQ69G5FAW
        taskId: 01ARZ3NDEKTSV4RRFFQ69G5FAX
        retryable: false
        clientAction: none
        details:
          visibility: metadata_only
    InternalProblem:
      summary: Synthetic internal problem.
      value:
        type: about:blank
        title: Audit is unavailable.
        status: 503
        category: internal_error
        code: audit_unavailable
        message: The command cannot be accepted until audit recording is available.
        correlationId: 01ARZ3NDEKTSV4RRFFQ69G5FAW
        retryable: true
        clientAction: retry-later
        details:
          visibility: metadata_only
