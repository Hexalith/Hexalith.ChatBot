openapi: 3.1.0
info:
  title: Hexalith.ChatBot API
  version: v1
  summary: Contract Spine foundation for governed chatbot command submission.
  description: >
    Canonical OpenAPI 3.1 foundation for Hexalith.ChatBot. This document defines
    the smallest adapter-facing command submission surface for structural parity.
    Tenant authority comes from authenticated context and later authoritative
    processing metadata, never from request bodies, query parameters, or
    client-controlled headers.
servers:
  - url: /api/v1
    description: URL-versioned REST surface. Deployment hosts, issuer values, and audience values are supplied by environment configuration.
tags:
  - name: commands
    description: Adapter-facing command submission contracts.
  - name: operations
    description: Tenant-scoped long-running operation status contracts.
security:
  - oidcBearer: []
paths:
  /api/v1/commands:
    post:
      tags:
        - commands
      operationId: SubmitCommand
      summary: Submit a typed ChatBot command for governed processing.
      description: >
        Accepts a typed ChatBot command shape from an adapter and returns accepted
        metadata. The operation records only contract-level submission intent; it
        does not execute domain behavior or expose internal processing stages.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandSubmissionRequest"
            examples:
              synthetic:
                $ref: "#/components/examples/CommandSubmissionRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedCommand"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/InternalFailure"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-command-submission:
        adapterContract: IChatBotClient.SubmitAsync
        commandMarker: IChatBotCommand
        tenantAuthority: authenticated-context
        runtimeBehavior: deferred-to-later-stories
      x-hexalith-correlation:
        correlationHeader: X-Correlation-Id
        taskHeader: X-Hexalith-Task-Id
        adapterBehavior: caller-provided-or-generated-correlation
      x-hexalith-canonical-error-categories:
        - authentication_failure
        - authorization_denied
        - validation_error
        - conflict
        - internal_error
  /api/v1/operations/{operationId}:
    get:
      tags:
        - operations
      operationId: GetOperationStatus
      summary: Read metadata-only status for a tracked operation.
      description: >
        Returns tenant-scoped operation status metadata without exposing command
        command content or confirming whether an operation exists outside the caller's
        authenticated tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Opaque operation identifier.
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskId"
              - $ref: "#/components/schemas/CommandId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/OperationStatus"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-operation-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
  /api/v1/operations/{operationId}/audit-history:
    get:
      tags:
        - operations
      operationId: GetOperationAuditHistory
      summary: Read the metadata-only post-commit audit-history summary for a tracked operation.
      description: >
        Returns a tenant-scoped, redacted, metadata-only summary of the operation's
        post-commit audit envelope(s). It exposes stable codes and opaque identifiers
        only — never command content, tenant or resource names — and never confirms
        whether an operation exists outside the caller's authenticated tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Opaque operation identifier.
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskId"
              - $ref: "#/components/schemas/CommandId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/OperationAuditHistory"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-operation-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
  /api/v1/associations/{associationId}/routing-status:
    get:
      tags:
        - operations
      operationId: GetAssociationRoutingStatus
      summary: Read metadata-only association routing status.
      description: >
        Returns tenant-scoped, metadata-only association routing status for the
        S2 review surface. The response carries only authorized candidates,
        safe evidence references, lifecycle/status codes, and safe next-action
        reasons; unknown, invalid, or cross-tenant identifiers collapse to the
        same safe authorization denial.
      parameters:
        - name: associationId
          in: path
          required: true
          description: Opaque association workflow identifier.
          schema:
            $ref: "#/components/schemas/AssociationWorkflowId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/AssociationRoutingStatus"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-association-routing-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
        uiSurface: S2
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OpenID Connect bearer token supplied by the hosting environment.
  headers:
    CorrelationId:
      description: Opaque correlation identifier for support-safe tracing.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    TaskId:
      description: Opaque long-running task identifier when a submitted command is tracked asynchronously.
      schema:
        $ref: "#/components/schemas/TaskId"
    RetryAfter:
      description: Retry guidance in seconds when the caller can safely retry.
      schema:
        type: integer
        format: int32
        minimum: 1
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Opaque caller-supplied or client-generated correlation identifier.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    TaskId:
      name: X-Hexalith-Task-Id
      in: header
      required: false
      description: Opaque caller-supplied task identifier for long-running operation tracking.
      schema:
        $ref: "#/components/schemas/TaskId"
  responses:
    AcceptedCommand:
      description: Command submission accepted for later governed processing.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandSubmissionResponse"
          examples:
            synthetic:
              $ref: "#/components/examples/AcceptedCommand"
    ValidationFailure:
      description: Metadata-only validation failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/ValidationProblem"
    SafeAuthorizationDenial401:
      description: Metadata-only authentication failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/AuthenticationProblem"
    SafeAuthorizationDenial403:
      description: Metadata-only authorization denial.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/AuthorizationProblem"
    Conflict:
      description: Metadata-only conflict response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/ConflictProblem"
    InternalFailure:
      description: Metadata-only internal failure response.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/InternalProblem"
    OperationStatus:
      description: Metadata-only long-running operation status.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationStatus"
          examples:
            projectionPending:
              $ref: "#/components/examples/OperationStatusProjectionPending"
    OperationAuditHistory:
      description: Metadata-only post-commit audit-history summary.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationAuditHistory"
          examples:
            postCommit:
              $ref: "#/components/examples/OperationAuditHistoryPostCommit"
    AssociationRoutingStatus:
      description: Metadata-only association routing status.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssociationRoutingStatus"
  schemas:
    CommandSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - commandId
        - commandType
        - command
        - requestSchemaVersion
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        commandType:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Z][A-Za-z0-9]*$"
          description: Imperative command contract type name without the Command suffix.
          not:
            pattern: "Command$"
        command:
          type: object
          additionalProperties: true
          description: Typed command body supplied through IChatBotCommand.
        requestSchemaVersion:
          type: string
          enum:
            - v1
        actorType:
          $ref: "#/components/schemas/ActorType"
        riskClass:
          $ref: "#/components/schemas/RiskClass"
        thresholdBand:
          $ref: "#/components/schemas/ThresholdBand"
        origin:
          $ref: "#/components/schemas/SurfaceOrigin"
    CommandSubmissionResponse:
      allOf:
        - $ref: "#/components/schemas/AcceptedCommand"
    AcceptedCommand:
      type: object
      additionalProperties: false
      required:
        - commandId
        - correlationId
        - lifecycleState
        - acceptedAt
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        taskId:
          $ref: "#/components/schemas/TaskId"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        acceptedAt:
          type: string
          format: date-time
          description: UTC acceptance timestamp.
    OperationStatus:
      type: object
      additionalProperties: false
      required:
        - operationId
        - commandId
        - correlationId
        - lifecycleState
        - retryCount
        - completionStatus
        - auditStatus
        - partialOutputs
        - safeNextActions
        - acceptedAt
        - lastUpdatedAt
      properties:
        operationId:
          oneOf:
            - $ref: "#/components/schemas/TaskId"
            - $ref: "#/components/schemas/CommandId"
        commandId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        retryCount:
          type: integer
          format: int32
          minimum: 0
        completionStatus:
          $ref: "#/components/schemas/OperationCompletionStatus"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
        partialOutputs:
          $ref: "#/components/schemas/OperationStatusPartialOutputs"
        safeNextActions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatBotMessageNextAction"
        terminalReason:
          $ref: "#/components/schemas/ChatBotMessageCode"
        acceptedAt:
          type: string
          format: date-time
          description: UTC acceptance timestamp.
        lastUpdatedAt:
          type: string
          format: date-time
          description: UTC last status update timestamp.
    OperationStatusPartialOutputs:
      type: object
      additionalProperties: false
      required:
        - acceptedAt
        - completionStatus
        - auditStatus
      properties:
        acceptedAt:
          type: string
          format: date-time
        completionStatus:
          $ref: "#/components/schemas/OperationCompletionStatus"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
    OperationAuditHistory:
      type: object
      additionalProperties: false
      required:
        - operationId
        - auditStatus
        - entries
      properties:
        operationId:
          oneOf:
            - $ref: "#/components/schemas/TaskId"
            - $ref: "#/components/schemas/CommandId"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
        entries:
          type: array
          description: Post-commit audit envelope summaries for the operation, in record order.
          items:
            $ref: "#/components/schemas/AuditHistoryEntry"
    AuditHistoryEntry:
      type: object
      additionalProperties: false
      required:
        - phase
        - decision
        - reasonCode
        - outcome
        - stateTransition
        - redactionDecision
        - surfaceOrigin
        - resourceId
        - correlationId
        - recordedAt
      properties:
        phase:
          $ref: "#/components/schemas/AuditHistoryPhase"
        decision:
          type: string
          minLength: 1
          maxLength: 40
          description: Stable audit decision code (e.g. allow, reject).
        reasonCode:
          type: string
          minLength: 1
          maxLength: 80
          description: Stable audit reason code.
        outcome:
          type: string
          minLength: 1
          maxLength: 40
          description: Stable audit outcome code.
        stateTransition:
          type: string
          minLength: 1
          maxLength: 80
          description: Lifecycle state-transition code carried by the envelope.
        redactionDecision:
          type: string
          enum:
            - metadata_only
        surfaceOrigin:
          $ref: "#/components/schemas/SurfaceOrigin"
        resourceId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        recordedAt:
          type: string
          format: date-time
          description: UTC audit record timestamp.
    AuditHistoryPhase:
      type: string
      enum:
        - pre-commit
        - post-commit
    OperationCompletionStatus:
      type: string
      enum:
        - accepted-projection-pending
        - completed
        - failed
    OperationAuditStatus:
      type: string
      enum:
        - committed
        - reconciling
    ChatBotMessageNextAction:
      type: string
      enum:
        - authenticate
        - retry-later
        - request-access
        - escalate
        - dismiss
        - correct-request
        - none
    ChatBotMessageCode:
      type: string
      enum:
        - authentication_denied
        - authorization_denied
        - audit_unavailable
        - idempotency_conflict_command_execution
        - idempotency_conflict_message_intake
        - invalid_lifecycle_transition
        - refusal_blocked_action
        - dependency_degraded
        - failed_attachment
        - failed_command
        - degraded_mailbox
        - unresolved_participant
        - unauthorized_participant
        - participant_directory_degraded
        - invalid_threshold_policy
        - unauthorized_threshold_update
        - association_ambiguous_routed
        - association_scorer_failed_closed
        - association_scorer_unavailable
        - association_conflicting_deterministic_evidence
        - association_context_unavailable
        - association_candidate_suppressed
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - category
        - code
        - message
        - correlationId
        - retryable
        - clientAction
        - details
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
          maxLength: 240
        instance:
          type: string
          format: uri-reference
        category:
          type: string
          enum:
            - authentication_failure
            - authorization_denied
            - validation_error
            - conflict
            - internal_error
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
          minLength: 1
          maxLength: 240
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        taskId:
          $ref: "#/components/schemas/TaskId"
        retryable:
          type: boolean
        clientAction:
          type: string
          enum:
            - authenticate
            - retry-later
            - request-access
            - escalate
            - dismiss
            - correct-request
            - none
        details:
          $ref: "#/components/schemas/ProblemDetailsDetails"
    ProblemDetailsDetails:
      type: object
      additionalProperties: false
      required:
        - visibility
      properties:
        visibility:
          type: string
          enum:
            - metadata_only
    CommandId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    CorrelationId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    TaskId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    MailboxMessageIntakeId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    ParticipantResolutionId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    AssociationWorkflowId:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    CaptureMailboxMessageIntake:
      type: object
      additionalProperties: false
      required:
        - intakeId
        - source
        - recipients
        - attachments
      properties:
        intakeId:
          $ref: "#/components/schemas/MailboxMessageIntakeId"
        source:
          $ref: "#/components/schemas/MailboxMessageSourceIdentity"
        recipients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MailboxRecipientIdentity"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/MailboxAttachmentReference"
    MailboxMessageSourceIdentity:
      type: object
      additionalProperties: false
      required:
        - providerMessageId
        - internetMessageId
        - conversationId
        - mailboxId
        - sender
        - receivedAt
        - sourceContext
        - sourceSchemaVersion
      properties:
        providerMessageId:
          type: string
          minLength: 1
          maxLength: 512
        internetMessageId:
          type: string
          minLength: 1
          maxLength: 512
        conversationId:
          type: string
          minLength: 1
          maxLength: 512
        threadId:
          type: string
          minLength: 1
          maxLength: 512
        mailboxId:
          type: string
          minLength: 1
          maxLength: 512
        sender:
          $ref: "#/components/schemas/MailboxParticipantIdentity"
        receivedAt:
          type: string
          format: date-time
          description: UTC provider received timestamp with source timezone context preserved separately.
        sentAt:
          type: string
          format: date-time
          description: UTC provider sent timestamp with source timezone context preserved separately.
        createdAt:
          type: string
          format: date-time
          description: UTC provider created timestamp with source timezone context preserved separately.
        sourceTimezone:
          type: string
          minLength: 1
          maxLength: 120
        sourceContext:
          type: string
          minLength: 1
          maxLength: 120
        sourceSchemaVersion:
          type: integer
          format: int32
          minimum: 1
    MailboxParticipantIdentity:
      type: object
      additionalProperties: false
      required:
        - address
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 320
        displayName:
          type: string
          maxLength: 320
    MailboxRecipientIdentity:
      type: object
      additionalProperties: false
      required:
        - address
        - kind
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 320
        displayName:
          type: string
          maxLength: 320
        kind:
          type: string
          enum:
            - to
            - cc
            - bcc
    MailboxAttachmentReference:
      type: object
      additionalProperties: false
      required:
        - providerAttachmentId
      properties:
        providerAttachmentId:
          type: string
          minLength: 1
          maxLength: 512
        name:
          type: string
          maxLength: 512
        contentType:
          type: string
          maxLength: 160
        sizeInBytes:
          type: integer
          format: int64
          minimum: 0
    ResolveMailboxMessageParticipants:
      type: object
      additionalProperties: false
      required:
        - resolutionId
        - intakeId
        - sourceMailboxId
        - sourceParticipants
        - resolvedParticipants
        - unresolvedParticipants
        - resolutionKernelVersion
      properties:
        resolutionId:
          $ref: "#/components/schemas/ParticipantResolutionId"
        intakeId:
          $ref: "#/components/schemas/MailboxMessageIntakeId"
        sourceMailboxId:
          type: string
          minLength: 1
          maxLength: 512
        sourceParticipants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MailboxParticipantSourceReference"
        resolvedParticipants:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedMailboxParticipantReference"
        unresolvedParticipants:
          type: array
          items:
            $ref: "#/components/schemas/UnresolvedMailboxParticipantEvidence"
        resolutionKernelVersion:
          type: string
          minLength: 1
          maxLength: 120
    MailboxParticipantSourceReference:
      type: object
      additionalProperties: false
      required:
        - sourceParticipantId
        - role
        - evidenceReference
        - evidenceFingerprint
        - addressEvidence
      properties:
        sourceParticipantId:
          $ref: "#/components/schemas/ParticipantResolutionId"
        role:
          type: string
          enum:
            - sender
            - to
            - cc
            - bcc
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 256
        evidenceFingerprint:
          type: string
          minLength: 1
          maxLength: 128
        addressEvidence:
          type: string
          minLength: 1
          maxLength: 320
        displayNameEvidence:
          type: string
          maxLength: 320
    ResolvedMailboxParticipantReference:
      type: object
      additionalProperties: false
      required:
        - sourceParticipantId
        - partyId
        - partyTenantId
        - evidenceReference
        - evidenceFingerprint
        - status
      properties:
        sourceParticipantId:
          $ref: "#/components/schemas/ParticipantResolutionId"
        partyId:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable PartyId reference; never provider display-name or address evidence.
        partyTenantId:
          type: string
          minLength: 1
          maxLength: 160
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 256
        evidenceFingerprint:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: "#/components/schemas/ParticipantResolutionStatus"
    UnresolvedMailboxParticipantEvidence:
      type: object
      additionalProperties: false
      required:
        - sourceParticipantId
        - evidenceReference
        - evidenceFingerprint
        - reason
        - allowedReviewActions
      properties:
        sourceParticipantId:
          $ref: "#/components/schemas/ParticipantResolutionId"
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 256
        evidenceFingerprint:
          type: string
          minLength: 1
          maxLength: 128
        reason:
          $ref: "#/components/schemas/ParticipantResolutionBlockedReason"
        allowedReviewActions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ParticipantReviewAction"
    ParticipantResolutionStatus:
      type: string
      enum:
        - resolved
        - unresolved
        - rejected
        - quarantined
        - blocked
    ParticipantResolutionBlockedReason:
      type: string
      enum:
        - not-found
        - ambiguous-match
        - restricted-party
        - erased-party
        - tenant-mismatch
        - directory-degraded
