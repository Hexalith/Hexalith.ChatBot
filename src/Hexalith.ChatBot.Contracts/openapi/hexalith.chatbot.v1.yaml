openapi: 3.1.0
info:
  title: Hexalith.ChatBot API
  version: v1
  summary: Contract Spine foundation for governed chatbot command submission.
  description: >
    Canonical OpenAPI 3.1 foundation for Hexalith.ChatBot. This document defines
    the smallest adapter-facing command submission surface for structural parity.
    Tenant authority comes from authenticated context and later authoritative
    processing metadata, never from request bodies, query parameters, or
    client-controlled headers.
servers:
  - url: /api/v1
    description: URL-versioned REST surface. Deployment hosts, issuer values, and audience values are supplied by environment configuration.
tags:
  - name: commands
    description: Adapter-facing command submission contracts.
  - name: operations
    description: Tenant-scoped long-running operation status contracts.
  - name: projects
    description: Tenant-scoped project conversation read contracts.
security:
  - oidcBearer: []
paths:
  /api/v1/commands:
    post:
      tags:
        - commands
      operationId: SubmitCommand
      summary: Submit a typed ChatBot command for governed processing.
      description: >
        Accepts a typed ChatBot command shape from an adapter and returns accepted
        metadata. The operation records only contract-level submission intent; it
        does not execute domain behavior or expose internal processing stages.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandSubmissionRequest"
            examples:
              synthetic:
                $ref: "#/components/examples/CommandSubmissionRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedCommand"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/InternalFailure"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-command-submission:
        adapterContract: IChatBotClient.SubmitAsync
        commandMarker: IChatBotCommand
        tenantAuthority: authenticated-context
        runtimeBehavior: deferred-to-later-stories
      x-hexalith-correlation:
        correlationHeader: X-Correlation-Id
        taskHeader: X-Hexalith-Task-Id
        adapterBehavior: caller-provided-or-generated-correlation
      x-hexalith-canonical-error-categories:
        - authentication_failure
        - authorization_denied
        - validation_error
        - conflict
        - internal_error
  /api/v1/operations/{operationId}:
    get:
      tags:
        - operations
      operationId: GetOperationStatus
      summary: Read metadata-only status for a tracked operation.
      description: >
        Returns tenant-scoped operation status metadata without exposing command
        command content or confirming whether an operation exists outside the caller's
        authenticated tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Opaque operation identifier.
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskId"
              - $ref: "#/components/schemas/CommandId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/OperationStatus"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-operation-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
  /api/v1/operations/{operationId}/audit-history:
    get:
      tags:
        - operations
      operationId: GetOperationAuditHistory
      summary: Read the metadata-only post-commit audit-history summary for a tracked operation.
      description: >
        Returns a tenant-scoped, redacted, metadata-only summary of the operation's
        post-commit audit envelope(s). It exposes stable codes and opaque identifiers
        only — never command content, tenant or resource names — and never confirms
        whether an operation exists outside the caller's authenticated tenant.
      parameters:
        - name: operationId
          in: path
          required: true
          description: Opaque operation identifier.
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskId"
              - $ref: "#/components/schemas/CommandId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/OperationAuditHistory"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-operation-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
  /api/v1/associations/{associationId}/routing-status:
    get:
      tags:
        - operations
      operationId: GetAssociationRoutingStatus
      summary: Read metadata-only association routing status.
      description: >
        Returns tenant-scoped, metadata-only association routing status for the
        S2 review surface. The response carries only authorized candidates,
        safe evidence references, lifecycle/status codes, and safe next-action
        reasons; unknown, invalid, or cross-tenant identifiers collapse to the
        same safe authorization denial.
      parameters:
        - name: associationId
          in: path
          required: true
          description: Opaque association workflow identifier.
          schema:
            $ref: "#/components/schemas/AssociationWorkflowId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/AssociationRoutingStatus"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-association-routing-status:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        unknownOrCrossTenantResult: safe_not_found
        uiSurface: S2
  /api/v1/projects/{projectId}/conversation:
    get:
      tags:
        - projects
      operationId: GetProjectConversation
      summary: Read metadata-only project conversation context.
      description: >
        Returns tenant-scoped, project-partitioned S1 conversation context derived
        from governed email association metadata. The response never includes raw
        provider content, email bodies, unauthorized project names, tenant names,
        or cross-tenant cursor material.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Authorized project identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: cursor
          in: query
          required: false
          description: Opaque project-scoped pagination cursor.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: pageSize
          in: query
          required: false
          description: Maximum number of metadata-only conversation items to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/ProjectConversation"
        "401":
          $ref: "#/components/responses/SafeAuthorizationDenial401"
        "403":
          $ref: "#/components/responses/SafeAuthorizationDenial403"
        "500":
          $ref: "#/components/responses/InternalFailure"
      x-hexalith-project-conversation:
        tenantAuthority: authenticated-context
        responseVisibility: metadata-only
        partitionKeyShape: "{tenant}:project-conversation:{projectId}:{itemId}"
        pagination: cursor
        uiSurface: S1
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OpenID Connect bearer token supplied by the hosting environment.
  headers:
    CorrelationId:
      description: Opaque correlation identifier for support-safe tracing.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    TaskId:
      description: Opaque long-running task identifier when a submitted command is tracked asynchronously.
      schema:
        $ref: "#/components/schemas/TaskId"
    RetryAfter:
      description: Retry guidance in seconds when the caller can safely retry.
      schema:
        type: integer
        format: int32
        minimum: 1
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Opaque caller-supplied or client-generated correlation identifier.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    TaskId:
      name: X-Hexalith-Task-Id
      in: header
      required: false
      description: Opaque caller-supplied task identifier for long-running operation tracking.
      schema:
        $ref: "#/components/schemas/TaskId"
  responses:
    AcceptedCommand:
      description: Command submission accepted for later governed processing.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandSubmissionResponse"
          examples:
            synthetic:
              $ref: "#/components/examples/AcceptedCommand"
    ValidationFailure:
      description: Metadata-only validation failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/ValidationProblem"
    SafeAuthorizationDenial401:
      description: Metadata-only authentication failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/AuthenticationProblem"
    SafeAuthorizationDenial403:
      description: Metadata-only authorization denial.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/AuthorizationProblem"
    Conflict:
      description: Metadata-only conflict response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/ConflictProblem"
    InternalFailure:
      description: Metadata-only internal failure response.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            synthetic:
              $ref: "#/components/examples/InternalProblem"
    OperationStatus:
      description: Metadata-only long-running operation status.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationStatus"
          examples:
            projectionPending:
              $ref: "#/components/examples/OperationStatusProjectionPending"
    OperationAuditHistory:
      description: Metadata-only post-commit audit-history summary.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationAuditHistory"
          examples:
            postCommit:
              $ref: "#/components/examples/OperationAuditHistoryPostCommit"
    AssociationRoutingStatus:
      description: Metadata-only association routing status.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssociationRoutingStatus"
    ProjectConversation:
      description: Metadata-only project conversation context.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        X-Hexalith-Task-Id:
          $ref: "#/components/headers/TaskId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectConversationResponse"
  schemas:
    CommandSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - commandId
        - commandType
        - command
        - requestSchemaVersion
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        commandType:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Z][A-Za-z0-9]*$"
          description: Imperative command contract type name without the Command suffix.
          not:
            pattern: "Command$"
        command:
          type: object
          additionalProperties: true
          description: Typed command body supplied through IChatBotCommand.
        requestSchemaVersion:
          type: string
          enum:
            - v1
        actorType:
          $ref: "#/components/schemas/ActorType"
        riskClass:
          $ref: "#/components/schemas/RiskClass"
        thresholdBand:
          $ref: "#/components/schemas/ThresholdBand"
        origin:
          $ref: "#/components/schemas/SurfaceOrigin"
    CommandSubmissionResponse:
      allOf:
        - $ref: "#/components/schemas/AcceptedCommand"
    AcceptedCommand:
      type: object
      additionalProperties: false
      required:
        - commandId
        - correlationId
        - lifecycleState
        - acceptedAt
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        taskId:
          $ref: "#/components/schemas/TaskId"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        acceptedAt:
          type: string
          format: date-time
          description: UTC acceptance timestamp.
    OperationStatus:
      type: object
      additionalProperties: false
      required:
        - operationId
        - commandId
        - correlationId
        - lifecycleState
        - retryCount
        - completionStatus
        - auditStatus
        - partialOutputs
        - safeNextActions
        - operationClass
        - maxAttempts
        - acceptedAt
        - lastUpdatedAt
      properties:
        operationId:
          oneOf:
            - $ref: "#/components/schemas/TaskId"
            - $ref: "#/components/schemas/CommandId"
        commandId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        retryCount:
          type: integer
          format: int32
          minimum: 0
        completionStatus:
          $ref: "#/components/schemas/OperationCompletionStatus"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
        partialOutputs:
          $ref: "#/components/schemas/OperationStatusPartialOutputs"
        safeNextActions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatBotMessageNextAction"
        terminalReason:
          $ref: "#/components/schemas/ChatBotMessageCode"
        operationClass:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z][a-z0-9-]*$"
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
        nextRetryAt:
          type: string
          format: date-time
        duplicateSafetyNote:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[a-z][a-z0-9-]*$"
        ownerRole:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z][a-z0-9-]*$"
        failureReasonCode:
          $ref: "#/components/schemas/ChatBotMessageCode"
        terminalReasonCode:
          $ref: "#/components/schemas/ChatBotMessageCode"
        originalOperationId:
          oneOf:
            - $ref: "#/components/schemas/TaskId"
            - $ref: "#/components/schemas/CommandId"
        duplicateAttemptCount:
          type: integer
          format: int32
          minimum: 0
        acceptedAt:
          type: string
          format: date-time
          description: UTC acceptance timestamp.
        lastUpdatedAt:
          type: string
          format: date-time
          description: UTC last status update timestamp.
    OperationStatusPartialOutputs:
      type: object
      additionalProperties: false
      required:
        - acceptedAt
        - completionStatus
        - auditStatus
      properties:
        acceptedAt:
          type: string
          format: date-time
        completionStatus:
          $ref: "#/components/schemas/OperationCompletionStatus"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
    OperationAuditHistory:
      type: object
      additionalProperties: false
      required:
        - operationId
        - auditStatus
        - entries
      properties:
        operationId:
          oneOf:
            - $ref: "#/components/schemas/TaskId"
            - $ref: "#/components/schemas/CommandId"
        auditStatus:
          $ref: "#/components/schemas/OperationAuditStatus"
        entries:
          type: array
          description: Post-commit audit envelope summaries for the operation, in record order.
          items:
            $ref: "#/components/schemas/AuditHistoryEntry"
    AuditHistoryEntry:
      type: object
      additionalProperties: false
      required:
        - phase
        - decision
        - reasonCode
        - outcome
        - stateTransition
        - redactionDecision
        - surfaceOrigin
        - resourceId
        - correlationId
        - recordedAt
      properties:
        phase:
          $ref: "#/components/schemas/AuditHistoryPhase"
        decision:
          type: string
          minLength: 1
          maxLength: 40
          description: Stable audit decision code (e.g. allow, reject).
        reasonCode:
          type: string
          minLength: 1
          maxLength: 80
          description: Stable audit reason code.
        outcome:
          type: string
          minLength: 1
          maxLength: 40
          description: Stable audit outcome code.
        stateTransition:
          type: string
          minLength: 1
          maxLength: 80
          description: Lifecycle state-transition code carried by the envelope.
        redactionDecision:
          type: string
          enum:
            - metadata_only
        surfaceOrigin:
          $ref: "#/components/schemas/SurfaceOrigin"
        resourceId:
          $ref: "#/components/schemas/CommandId"
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        recordedAt:
          type: string
          format: date-time
          description: UTC audit record timestamp.
    AuditHistoryPhase:
      type: string
      enum:
        - pre-commit
        - post-commit
    OperationCompletionStatus:
      type: string
      enum:
        - accepted-projection-pending
        - completed
        - failed
    OperationAuditStatus:
      type: string
      enum:
        - committed
        - reconciling
    ProjectConversationReadStatus:
      type: string
      enum:
        - current
        - empty
        - stale
        - degraded
        - blocked
    ProjectConversationItemKind:
      type: string
      enum:
        - email-derived
        - system-decision
        - participant
        - attachment
        - approval-event
        - failure-state
        - ai-outcome
    ProjectConversationActorKind:
      type: string
      enum:
        - mailbox
        - system-decision
        - internal-participant
        - external-participant
        - unresolved-participant
        - restricted-participant
        - mailbox-attachment
        - approval-system
        - system-status
        - ai-actor
    AiOutcomeKind:
      type: string
      enum:
        - proposal
        - denial
        - refusal
        - approval-linked
        - execution-started
        - execution-succeeded
        - execution-failed
        - outcome-recorded
        - corrected-context-invalidated
    AiOutcomeStatus:
      type: string
      enum:
        - proposed
        - blocked
        - denied
        - pending-approval
        - approved
        - executing
        - succeeded
        - failed
        - invalidated
        - unknown
    FailureStateKind:
      type: string
      enum:
        - failure
        - retry-queued
        - retry-accepted
        - retry-exhausted
        - blocked
        - duplicate-suppressed
        - dependency-degraded
        - projection-retryable
        - terminal-failure
        - reprocess-created
    FailureStatus:
      type: string
      enum:
        - retryable
        - terminal
        - blocked
        - degraded
        - resolved
        - unknown
    ApprovalEventKind:
      type: string
      enum:
        - request
        - decision
        - outcome
    ApprovalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - revision-requested
        - cancelled
        - executed
        - failed
    ApprovalDecisionKind:
      type: string
      enum:
        - approve
        - reject
        - request-revision
        - cancel
    ApprovalEvidenceFreshness:
      type: string
      enum:
        - fresh
        - stale
        - expired
    ProjectConversationAttachmentStatus:
      type: string
      enum:
        - captured
        - pending
        - unavailable
        - rejected
        - unsafe
        - failed
        - retryable
    ProjectConversationParticipantDisplayKind:
      type: string
      enum:
        - internal-participant
        - external-participant
        - unresolved-participant
        - restricted-participant
    ProjectConversationResponse:
      type: object
      additionalProperties: false
      required:
        - projectId
        - status
        - conversationState
        - items
        - page
        - sourceProvenance
        - redactionState
        - retentionClass
        - schemaVersion
        - correlationId
      properties:
        projectId:
          type: string
          minLength: 1
          maxLength: 256
        projectDisplayName:
          type: string
          minLength: 1
          maxLength: 256
        tenantContext:
          type: string
          minLength: 1
          maxLength: 160
          description: Safe tenant context label only when authorized and configured for display.
        status:
          $ref: "#/components/schemas/ProjectConversationReadStatus"
        conversationState:
          $ref: "#/components/schemas/LifecycleState"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConversationItem"
        page:
          $ref: "#/components/schemas/ProjectConversationCursorPage"
        sourceProvenance:
          type: string
          enum:
            - m365-mailbox-intake
        redactionState:
          type: string
          enum:
            - metadata_only
        retentionClass:
          type: string
          enum:
            - collaboration_input
        schemaVersion:
          type: string
          enum:
            - chatbot.project-conversation-response.v1
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        safeNextAction:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[a-z][a-z0-9-]*$"
        aiContextPackage:
          $ref: "#/components/schemas/ProjectAiContextPackage"
    ProjectAiContextPackage:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - projectId
        - policySnapshotId
        - redactionDecision
        - retentionClass
        - providerReuseSetting
        - packageId
        - packageVersion
        - schemaVersion
        - sourceVersion
        - correlationId
        - includedFiles
        - excludedFiles
        - sourceEvidenceReferences
        - sourceProvenance
        - derivationKernelVersion
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 160
          description: Authorized tenant scope reference for the package; never raw tenant authority and never present in denial bodies.
        projectId:
          type: string
          minLength: 1
          maxLength: 256
        policySnapshotId:
          type: string
          minLength: 1
          maxLength: 256
          description: Authorized policy snapshot identifier only; never policy body.
        redactionDecision:
          type: string
          enum:
            - metadata_only
        retentionClass:
          type: string
          enum:
            - collaboration_input
        providerReuseSetting:
          type: string
          enum:
            - disabled
        packageId:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable package reference; never raw provider detail or file content.
        packageVersion:
          type: string
          enum:
            - v1
        schemaVersion:
          type: string
          enum:
            - chatbot.project-ai-context-package.v1
        sourceVersion:
          type: integer
          format: int64
          minimum: 0
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        includedFiles:
          type: array
          items:
            $ref: "#/components/schemas/ProjectAiContextPackageFile"
        excludedFiles:
          type: array
          items:
            $ref: "#/components/schemas/ProjectAiContextPackageExclusion"
        sourceEvidenceReferences:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
        sourceProvenance:
          type: string
          enum:
            - m365-mailbox-intake
        derivationKernelVersion:
          type: string
          enum:
            - chatbot.project-ai-context-package.kernel.v1
    ProjectAiContextPackageFile:
      type: object
      additionalProperties: false
      required:
        - referenceToken
        - folderId
        - fileId
        - sourceProviderAttachmentId
        - redactionState
        - retentionClass
        - sourceEvidenceReference
      properties:
        referenceToken:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable metadata reference token only.
        folderId:
          type: string
          minLength: 1
          maxLength: 256
          description: Authorized stable folder reference only; never folder name or path.
        fileId:
          type: string
          minLength: 1
          maxLength: 256
          description: Authorized stable file reference only; never file name, path, bytes, or content.
        sourceProviderAttachmentId:
          type: string
          minLength: 1
          maxLength: 512
